<!doctype html><html><head><meta charset="utf-8"><title>Memory Match</title><style>body{background:#111;color:#fff;text-align:center}.g{width:360px;margin:auto;display:grid;grid-template-columns:repeat(4,1fr);gap:8px}button{height:80px;font-size:28px}</style></head><body><h2>Memory Match</h2><div class=g id=g></div><script>let vals=['🍎','🍎','⭐','⭐','🚀','🚀','👾','👾','🔥','🔥','🐸','🐸','💎','💎','🎲','🎲'].sort(()=>Math.random()-.5),first=null;vals.forEach((v,i)=>{let b=document.createElement('button');b.textContent='❓';b.onclick=()=>{if(b.textContent!=='❓')return;b.textContent=v;if(!first)first=b;else{if(first.textContent!==v){let f=first;setTimeout(()=>{f.textContent='❓';b.textContent='❓'},500)}first=null}};g.appendChild(b)})</script></body></html>
