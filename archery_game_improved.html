<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Archery Arena</title>
<style>
  :root{
    --bg:#0b1020;
    --panel:rgba(19,27,49,.82);
    --line:rgba(255,255,255,.12);
    --text:#f5f7ff;
    --muted:#aeb8d0;
    --accent:#ffb84d;
    --accent2:#6ee7ff;
  }
  *{box-sizing:border-box}
  body{
    margin:0; min-height:100vh; display:flex; justify-content:center;
    align-items:center; padding:24px; color:var(--text);
    font-family:Inter,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
    background:
      radial-gradient(circle at 20% 15%,rgba(110,231,255,.12),transparent 28%),
      radial-gradient(circle at 85% 80%,rgba(255,184,77,.10),transparent 30%),
      var(--bg);
  }
  .app{width:min(980px,100%)}
  .topbar{
    display:flex; justify-content:space-between; align-items:end; gap:20px;
    margin-bottom:14px;
  }
  .eyebrow{
    margin:0 0 5px; color:var(--accent2); text-transform:uppercase;
    letter-spacing:.18em; font-size:.72rem; font-weight:800;
  }
  h1{margin:0;font-size:clamp(2rem,5vw,3.3rem);line-height:1}
  .subtitle{margin:8px 0 0;color:var(--muted)}
  .stats{display:flex;gap:10px;flex-wrap:wrap;justify-content:flex-end}
  .stat{
    min-width:105px;padding:11px 15px;border:1px solid var(--line);
    background:var(--panel);border-radius:14px;text-align:center;
    backdrop-filter:blur(10px);
  }
  .stat span{display:block;color:var(--muted);font-size:.72rem;text-transform:uppercase;letter-spacing:.1em}
  .stat strong{font-size:1.35rem}
  .game-card{
    position:relative;padding:12px;border:1px solid var(--line);border-radius:22px;
    background:var(--panel);box-shadow:0 24px 70px rgba(0,0,0,.35);
    backdrop-filter:blur(14px);
  }
  canvas{
    display:block;width:100%;height:auto;border-radius:15px;
    background:#dff2ff; touch-action:none; cursor:crosshair;
  }
  .controls{
    display:flex;align-items:center;justify-content:space-between;gap:14px;
    margin-top:12px;flex-wrap:wrap;
  }
  .hint{color:var(--muted);font-size:.9rem}
  button{
    border:0;border-radius:12px;padding:11px 18px;font:inherit;font-weight:800;
    color:#16120b;background:var(--accent);cursor:pointer;
    box-shadow:0 7px 20px rgba(255,184,77,.18);transition:.18s transform,.18s filter;
  }
  button:hover{transform:translateY(-2px);filter:brightness(1.06)}
  button:active{transform:translateY(0)}
  .toast{
    position:absolute;left:50%;top:22px;transform:translate(-50%,-15px);
    padding:10px 16px;border-radius:999px;background:rgba(10,15,28,.86);
    border:1px solid var(--line);font-weight:900;opacity:0;pointer-events:none;
    transition:.22s ease;white-space:nowrap;
  }
  .toast.show{opacity:1;transform:translate(-50%,0)}
  .legend{
    margin-top:12px;color:var(--muted);font-size:.82rem;text-align:center
  }
  @media(max-width:700px){
    body{padding:12px}.topbar{align-items:flex-start;flex-direction:column}
    .stats{justify-content:flex-start}.stat{min-width:92px}
    .game-card{padding:7px;border-radius:17px}.controls{align-items:stretch}
    button{width:100%}.hint{width:100%;text-align:center}
  }
</style>
</head>
<body>
<main class="app">
  <header class="topbar">
    <div>
      <p class="eyebrow">Precision Challenge</p>
      <h1>🏹 Archery Arena</h1>
      <p class="subtitle">Pull back, aim, and land the arrow in the center.</p>
    </div>
    <div class="stats">
      <div class="stat"><span>Score</span><strong id="scoreNum">0</strong></div>
      <div class="stat"><span>Shots</span><strong id="shotsNum">0</strong></div>
      <div class="stat"><span>Best</span><strong id="bestNum">0</strong></div>
    </div>
  </header>

  <section class="game-card">
    <canvas id="archeryCanvas" width="900" height="520" aria-label="Archery game"></canvas>
    <div id="toast" class="toast">Bullseye! +100</div>
    <div class="controls">
      <div class="hint">🖱️ Drag from the bow to aim • Pull farther for more power • Release to fire</div>
      <button id="resetBtn">Restart Game</button>
    </div>
  </section>
  <div class="legend">🎯 100 center • 25 inner • 10 middle • 5 outer</div>
</main>

<script>
const canvas = document.getElementById("archeryCanvas");
const ctx = canvas.getContext("2d");
const scoreEl = document.getElementById("scoreNum");
const shotsEl = document.getElementById("shotsNum");
const bestEl = document.getElementById("bestNum");
const toast = document.getElementById("toast");
const W = canvas.width, H = canvas.height;

let arrows = [], particles = [], score = 0, shots = 0, aiming = false, aimArrow = null;
let best = Number(localStorage.getItem("archeryBest") || 0);
bestEl.textContent = best;

const bow = {x:105, y:H/2};
const target = {x:W-125, y:H/2, r:66};
const stars = Array.from({length:55},()=>({x:Math.random()*W,y:Math.random()*H,r:Math.random()*1.7+.3,a:Math.random()*.5+.15}));

function pointerPos(e){
  const r=canvas.getBoundingClientRect();
  return {x:(e.clientX-r.left)*W/r.width,y:(e.clientY-r.top)*H/r.height};
}
function showToast(text){
  toast.textContent=text; toast.classList.add("show");
  clearTimeout(showToast.timer); showToast.timer=setTimeout(()=>toast.classList.remove("show"),800);
}
function drawBackground(){
  const g=ctx.createLinearGradient(0,0,0,H);
  g.addColorStop(0,"#8ed7f3"); g.addColorStop(.58,"#dff5ff"); g.addColorStop(1,"#b7d8a2");
  ctx.fillStyle=g; ctx.fillRect(0,0,W,H);
  ctx.fillStyle="rgba(255,255,255,.8)";
  stars.forEach(s=>{ctx.globalAlpha=s.a;ctx.beginPath();ctx.arc(s.x,s.y,s.r,0,Math.PI*2);ctx.fill()});
  ctx.globalAlpha=1;
  // distant hills
  ctx.fillStyle="rgba(61,105,89,.20)";
  ctx.beginPath();ctx.moveTo(0,H*.78);ctx.quadraticCurveTo(W*.2,H*.58,W*.4,H*.77);
  ctx.quadraticCurveTo(W*.62,H*.56,W,H*.75);ctx.lineTo(W,H);ctx.lineTo(0,H);ctx.fill();
  ctx.fillStyle="rgba(42,81,70,.18)";
  ctx.beginPath();ctx.moveTo(0,H*.88);ctx.quadraticCurveTo(W*.25,H*.69,W*.48,H*.87);
  ctx.quadraticCurveTo(W*.72,H*.7,W,H*.84);ctx.lineTo(W,H);ctx.lineTo(0,H);ctx.fill();
}
function drawTarget(){
  ctx.save();
  ctx.shadowColor="rgba(0,0,0,.25)";ctx.shadowBlur=18;
  const rings=[["#f7f7f7",1],["#e34b4b",.8],["#f7f7f7",.6],["#e34b4b",.4],["#ffd34e",.22]];
  rings.forEach(([c,f])=>{ctx.beginPath();ctx.arc(target.x,target.y,target.r*f,0,Math.PI*2);ctx.fillStyle=c;ctx.fill()});
  ctx.shadowBlur=0;
  ctx.strokeStyle="rgba(30,40,55,.45)";ctx.lineWidth=3;ctx.beginPath();ctx.arc(target.x,target.y,target.r,0,Math.PI*2);ctx.stroke();
  ctx.restore();
}
function drawBow(){
  ctx.save();
  ctx.translate(bow.x,bow.y);
  ctx.shadowColor="rgba(0,0,0,.3)";ctx.shadowBlur=10;
  ctx.strokeStyle="#6b3f22";ctx.lineWidth=12;ctx.lineCap="round";
  ctx.beginPath();ctx.arc(0,0,54,Math.PI/2,Math.PI*1.5);ctx.stroke();
  ctx.shadowBlur=0;ctx.strokeStyle="#f3eee3";ctx.lineWidth=3;
  ctx.beginPath();ctx.moveTo(0,-54);ctx.lineTo(0,54);ctx.stroke();
  if(aiming && aimArrow){
    ctx.strokeStyle="rgba(255,255,255,.8)";ctx.lineWidth=2;
    ctx.beginPath();ctx.moveTo(0,0);ctx.lineTo(aimArrow.x-bow.x,aimArrow.y-bow.y);ctx.stroke();
  }
  ctx.restore();
}
function drawArrow(a,preview=false){
  ctx.save();ctx.translate(a.x,a.y);ctx.rotate(a.angle);
  if(!preview){ctx.shadowColor="rgba(0,0,0,.25)";ctx.shadowBlur=5}
  ctx.strokeStyle="#4b2d1b";ctx.lineWidth=4;ctx.lineCap="round";
  ctx.beginPath();ctx.moveTo(-18,0);ctx.lineTo(30,0);ctx.stroke();
  ctx.shadowBlur=0;
  ctx.fillStyle="#d8a13b";ctx.beginPath();ctx.moveTo(30,0);ctx.lineTo(20,-7);ctx.lineTo(20,7);ctx.closePath();ctx.fill();
  ctx.fillStyle="#d95c57";ctx.beginPath();ctx.moveTo(-18,0);ctx.lineTo(-27,-6);ctx.lineTo(-23,0);ctx.lineTo(-27,6);ctx.closePath();ctx.fill();
  ctx.restore();
}
function drawParticles(){
  particles.forEach(p=>{ctx.globalAlpha=Math.max(0,p.life);ctx.fillStyle=p.color;ctx.beginPath();ctx.arc(p.x,p.y,p.size,0,Math.PI*2);ctx.fill()});
  ctx.globalAlpha=1;
}
function draw(){
  drawBackground();drawTarget();drawBow();
  arrows.forEach(a=>drawArrow(a));particles.length&&drawParticles();
  if(aimArrow)drawArrow(aimArrow,true);
}
function shoot(power,angle){
  arrows.push({x:bow.x+28*Math.cos(angle),y:bow.y+28*Math.sin(angle),
    vx:power*Math.cos(angle),vy:power*Math.sin(angle),angle});
  shots++;shotsEl.textContent=shots;
}
function burst(x,y,color){
  for(let i=0;i<18;i++) particles.push({x,y,vx:(Math.random()-.5)*5,vy:(Math.random()-.5)*5,
    life:1,size:Math.random()*3+1,color});
}
function update(){
  arrows.forEach((a,i)=>{
    a.x+=a.vx;a.y+=a.vy;a.vy+=.16;a.vx*=.999;
    a.angle=Math.atan2(a.vy,a.vx);
    const dx=a.x-target.x,dy=a.y-target.y,dist=Math.hypot(dx,dy);
    if(dist<target.r){
      let pts=dist<target.r*.22?100:dist<target.r*.42?25:dist<target.r*.68?10:5;
      score+=pts;scoreEl.textContent=score;
      if(score>best){best=score;bestEl.textContent=best;localStorage.setItem("archeryBest",best)}
      burst(a.x,a.y,pts===100?"#ffd34e":"#e34b4b");
      showToast(pts===100?"🎯 Bullseye! +100":`+${pts} points`);
      arrows.splice(i,1);
    } else if(a.x>W+50||a.y>H+50||a.y<-50) arrows.splice(i,1);
  });
  particles.forEach(p=>{p.x+=p.vx;p.y+=p.vy;p.vy+=.08;p.life-=.025});
  particles=particles.filter(p=>p.life>0);
}
function resetGame(){
  arrows=[];particles=[];score=0;shots=0;aimArrow=null;aiming=false;
  scoreEl.textContent=0;shotsEl.textContent=0;toast.classList.remove("show");
}
canvas.addEventListener("pointerdown",e=>{
  const p=pointerPos(e);
  if(Math.hypot(p.x-bow.x,p.y-bow.y)>90)return;
  canvas.setPointerCapture(e.pointerId);aiming=true;
  aimArrow={x:bow.x,y:bow.y,angle:0};
});
canvas.addEventListener("pointermove",e=>{
  if(!aiming)return;
  const p=pointerPos(e),dx=bow.x-p.x,dy=bow.y-p.y;
  const angle=Math.atan2(dy,dx),dist=Math.min(Math.hypot(dx,dy),130);
  aimArrow={x:bow.x+dist*Math.cos(angle),y:bow.y+dist*Math.sin(angle),angle};
});
canvas.addEventListener("pointerup",e=>{
  if(!aiming)return;
  const p=pointerPos(e),dx=bow.x-p.x,dy=bow.y-p.y,dist=Math.hypot(dx,dy);
  if(dist>12){
    const angle=Math.atan2(dy,dx),power=Math.min(dist/8,12);
    shoot(power,angle);
  }
  aiming=false;aimArrow=null;
});
document.getElementById("resetBtn").addEventListener("click",resetGame);

function loop(){update();draw();requestAnimationFrame(loop)}
draw();loop();
</script>
</body>
</html>
