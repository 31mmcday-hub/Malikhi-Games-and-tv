<!doctype html><html><head><meta charset="utf-8"><title>Dodge</title><style>body{margin:0;background:#000;text-align:center;color:#fff}canvas{background:#090909}</style></head><body><h2>Dodge — Arrow Keys</h2><canvas id=c width=500 height=500></canvas><script>const x=c.getContext('2d');let p={x:240,y:440},o=[];onkeydown=e=>{if(e.key==='ArrowLeft')p.x-=12;if(e.key==='ArrowRight')p.x+=12};setInterval(()=>{if(Math.random()<.08)o.push({x:Math.random()*480,y:-20,v:3+Math.random()*4});o.forEach(a=>a.y+=a.v);x.clearRect(0,0,500,500);x.fillStyle='#0ff';x.fillRect(p.x,p.y,20,20);x.fillStyle='#f33';o.forEach(a=>{x.fillRect(a.x,a.y,20,20);if(Math.abs(a.x-p.x)<20&&Math.abs(a.y-p.y)<20)location.reload()})},30)</script></body></html>
