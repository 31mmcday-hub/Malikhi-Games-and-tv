<!doctype html><html><head><meta charset="utf-8"><title>Snake</title><style>body{margin:0;background:#111;color:#fff;text-align:center;font:20px Arial}canvas{background:#000;margin-top:10px}</style></head><body><h2>Snake</h2><canvas id=c width=500 height=500></canvas><script>
const c=document.querySelector('#c'),x=c.getContext('2d'),n=25,s=20;let q=[{x:12,y:12}],d={x:1,y:0},food={x:5,y:5};onkeydown=e=>{let k=e.key;if(k==='ArrowUp'&&d.y!==1)d={x:0,y:-1};if(k==='ArrowDown'&&d.y!==-1)d={x:0,y:1};if(k==='ArrowLeft'&&d.x!==1)d={x:-1,y:0};if(k==='ArrowRight'&&d.x!==-1)d={x:1,y:0}};setInterval(()=>{let h={x:(q[0].x+d.x+n)%n,y:(q[0].y+d.y+n)%n};if(q.some(z=>z.x===h.x&&z.y===h.y)){q=[{x:12,y:12}];return}q.unshift(h);if(h.x===food.x&&h.y===food.y)food={x:Math.random()*n|0,y:Math.random()*n|0};else q.pop();x.clearRect(0,0,500,500);x.fillStyle='#0f5';q.forEach(z=>x.fillRect(z.x*s,z.y*s,s-1,s-1));x.fillStyle='#f33';x.fillRect(food.x*s,food.y*s,s-1,s-1)},110)</script></body></html>
