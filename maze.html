<!doctype html><html><head><meta charset="utf-8"><title>Maze</title><style>body{background:#111;color:#fff;text-align:center;font:20px monospace}pre{font-size:28px}</style></head><body><h2>Maze</h2><pre id=p></pre><script>let x=1,y=1,maze=['#########','#     # #','# ### # #','# #   # #','# # ### #','# #     #','#########'];function d(){p.textContent=maze.map((r,j)=>r.split('').map((z,i)=>i===x&&j===y?'🙂':z).join('')).join('\n')}onkeydown=e=>{let q={ArrowUp:[0,-1],ArrowDown:[0,1],ArrowLeft:[-1,0],ArrowRight:[1,0]}[e.key];if(!q)return;let nx=x+q[0],ny=y+q[1];if(maze[ny][nx]!=='#'){x=nx;y=ny;if(x===7&&y===5){alert('You escaped!');x=1;y=1}}d()}d()</script></body></html>
