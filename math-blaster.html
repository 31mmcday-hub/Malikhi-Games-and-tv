<!doctype html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Math Blaster - Malikhi Games</title>

<style>
*{
  box-sizing:border-box;
}

body{
  margin:0;
  min-height:100vh;
  background:linear-gradient(135deg,#111827,#312e81);
  color:white;
  font-family:Arial,sans-serif;
  text-align:center;
}

h1{
  margin:20px 0 5px;
  font-size:36px;
}

#subtitle{
  opacity:.8;
}

#game{
  width:min(500px,94vw);
  margin:25px auto;
  padding:25px;
  background:rgba(255,255,255,.1);
  border:2px solid rgba(255,255,255,.2);
  border-radius:20px;
  box-shadow:0 15px 40px rgba(0,0,0,.3);
}

#stats{
  display:flex;
  justify-content:space-around;
  font-size:18px;
  margin-bottom:25px;
}

.stat{
  background:rgba(0,0,0,.25);
  padding:10px 15px;
  border-radius:12px;
}

#question{
  font-size:42px;
  font-weight:bold;
  margin:25px 0;
}

#answer{
  width:80%;
  max-width:300px;
  padding:15px;
  border:0;
  border-radius:12px;
  font-size:25px;
  text-align:center;
  outline:none;
}

button{
  margin:10px;
  padding:12px 22px;
  border:0;
  border-radius:12px;
  font-size:17px;
  font-weight:bold;
  cursor:pointer;
}

button:hover{
  transform:scale(1.05);
}

#submit{
  background:#22c55e;
  color:white;
}

#start{
  background:#facc15;
  color:#111;
}

#message{
  min-height:30px;
  margin:15px;
  font-size:20px;
  font-weight:bold;
}

#timerBar{
  height:10px;
  width:100%;
  background:rgba(255,255,255,.2);
  border-radius:20px;
  overflow:hidden;
  margin-bottom:20px;
}

#timer{
  height:100%;
  width:100%;
  background:#22c55e;
  transition:width .1s linear;
}

.hidden{
  display:none;
}
</style>
</head>

<body>

<h1>🧠 Math Blaster</h1>
<p id="subtitle">Solve the problems before time runs out! 💥</p>

<div id="game">

  <div id="stats">
    <div class="stat">⭐ Score: <span id="score">0</span></div>
    <div class="stat">🔥 Streak: <span id="streak">0</span></div>
    <div class="stat">⏱️ <span id="time">30</span></div>
  </div>

  <div id="timerBar">
    <div id="timer"></div>
  </div>

  <div id="question">Press Start</div>

  <input
    id="answer"
    type="number"
    placeholder="Answer"
    autocomplete="off"
  >

  <br>

  <button id="submit" onclick="checkAnswer()">✅ Submit</button>
  <button id="start" onclick="startGame()">🚀 Start Game</button>

  <div id="message"></div>

</div>

<script>

let score=0;
let streak=0;
let time=30;
let answer=0;
let playing=false;
let timerInterval=null;

const scoreEl=document.getElementById("score");
const streakEl=document.getElementById("streak");
const timeEl=document.getElementById("time");
const questionEl=document.getElementById("question");
const answerEl=document.getElementById("answer");
const messageEl=document.getElementById("message");
const timerEl=document.getElementById("timer");



function startGame(){

clearInterval(timerInterval);

score=0;
streak=0;
time=30;
playing=true;

scoreEl.textContent=score;
streakEl.textContent=streak;
timeEl.textContent=time;

messageEl.textContent="";

timerEl.style.width="100%";

newQuestion();

answerEl.focus();

timerInterval=setInterval(()=>{

time--;

timeEl.textContent=time;

timerEl.style.width=(time/30*100)+"%";

if(time<=0){

endGame();

}

},1000);

}



function newQuestion(){

let difficulty=Math.floor(score/5);

let max=10+difficulty*5;

let a=Math.floor(Math.random()*max)+1;
let b=Math.floor(Math.random()*max)+1;

let operations=["+","-","×"];

let operation=operations[
Math.floor(Math.random()*operations.length)
];

if(operation==="+"){

answer=a+b;

}

if(operation==="×"){

answer=a*b;

}

if(operation==="-"){

if(b>a){

let temp=a;
a=b;
b=temp;

}

answer=a-b;

}

questionEl.textContent=a+" "+operation+" "+b+" = ?";

answerEl.value="";

}



function checkAnswer(){

if(!playing)return;

let userAnswer=Number(answerEl.value);

if(answerEl.value===""){

messageEl.textContent="Type an answer first 😭";

return;

}

if(userAnswer===answer){

score++;

streak++;

scoreEl.textContent=score;
streakEl.textContent=streak;

messageEl.textContent=
streak>=3
?"🔥 "+streak+" STREAK!"
:"✅ Correct!";

newQuestion();

}else{

streak=0;

streakEl.textContent=streak;

messageEl.textContent="❌ Nope!";

answerEl.value="";

}

answerEl.focus();

}



function endGame(){

clearInterval(timerInterval);

playing=false;

questionEl.textContent="GAME OVER 💀";

messageEl.innerHTML=
"Final Score: <b>"+score+"</b> 🔥<br>"+
"Press Start to play again!";

}



answerEl.addEventListener("keydown",e=>{

if(e.key==="Enter"){

checkAnswer();

}

});



startGame();

</script>

</body>
</html>
