<!doctype html><html><head><meta charset="utf-8"><title>Bullet Hell</title><style>body{margin:0;background:#000;color:#fff;text-align:center}canvas{background:#050018}</style></head><body><canvas id=c width=600 height=600></canvas><script>const x=c.getContext('2d'),p={x:300,y:550};let k={},bs=[];onkeydown=e=>k[e.key]=1;onkeyup=e=>k[e.key]=0;setInterval(()=>{if(k.ArrowLeft)p.x-=5;if(k.ArrowRight)p.x+=5;if(k.ArrowUp)p.y-=5;if(k.ArrowDown)p.y+=5;if(Math.random()<.12)bs.push({x:Math.random()*600,y:0,v:2+Math.random()*3});bs.forEach(b=>b.y+=b.v);x.clearRect(0,0,600,600);x.fillStyle='#0ff';x.beginPath();x.arc(p.x,p.y,8,0,7);x.fill();x.fillStyle='#f33';bs.forEach(b=>{x.beginPath();x.arc(b.x,b.y,6,0,7);x.fill();if(Math.hypot(b.x-p.x,b.y-p.y)<14)location.reload()})},30)</script></body></html>
