<!doctype html><html><head><meta charset="utf-8"><title>Breakout</title><style>body{margin:0;background:#111;text-align:center}canvas{background:#000}</style></head><body><h2 style="color:white">Breakout</h2><canvas id=c width=640 height=480></canvas><script>const x=c.getContext('2d');let p=280,b={x:320,y:430,vx:4,vy:-4},q=[];for(let r=0;r<5;r++)for(let i=0;i<10;i++)q.push({x:i*64,y:r*25,on:1});onmousemove=e=>p=Math.max(0,Math.min(560,e.offsetX-40));setInterval(()=>{b.x+=b.vx;b.y+=b.vy;if(b.x<7||b.x>633)b.vx*=-1;if(b.y<7)b.vy*=-1;if(b.y>430&&b.x>p&&b.x<p+80)b.vy=-Math.abs(b.vy);if(b.y>480)location.reload();q.forEach(z=>{if(z.on&&b.x>z.x&&b.x<z.x+62&&b.y>z.y&&b.y<z.y+23){z.on=0;b.vy*=-1}});x.clearRect(0,0,640,480);x.fillStyle='#fff';x.fillRect(p,445,80,12);x.fillRect(b.x-6,b.y-6,12,12);x.fillStyle='#f55';q.forEach(z=>z.on&&x.fillRect(z.x,z.y,62,23))},16)</script></body></html>
