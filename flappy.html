<!doctype html><html><head><meta charset="utf-8"><title>Flappy</title><style>body{margin:0;background:#6cf;text-align:center;font-family:Arial}canvas{background:#8edbff;display:block;margin:auto}</style></head><body><h2>Flappy</h2><canvas id=c width=500 height=600></canvas><script>const x=c.getContext('2d');let y=300,v=0,score=0,pipes=[];onkeydown=()=>v=-8;onmousedown=()=>v=-8;setInterval(()=>{v+=.45;y+=v;if(Math.random()<.025)pipes.push({x:500,g:130+Math.random()*280});pipes.forEach(p=>p.x-=4);pipes=pipes.filter(p=>p.x>-60);x.clearRect(0,0,500,600);x.fillStyle='#5b3';pipes.forEach(p=>{x.fillRect(p.x,0,55,p.g-70);x.fillRect(p.x,p.g+70,55,600);if(p.x<80&&p.x+55>40&&(y< p.g-70||y+20>p.g+70))location.reload()});x.fillStyle='#f55';x.fillRect(40,y,22,22);x.fillStyle='#111';x.fillText('Score: '+score,10,20);if(y<0||y>580)location.reload();score++},30)</script></body></html>
