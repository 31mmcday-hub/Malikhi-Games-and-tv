<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Flappy Bird - Malikhi Games</title>

<style>
*{
  box-sizing:border-box;
}

body{
  margin:0;
  background:#111827;
  color:white;
  font-family:Arial,sans-serif;
  text-align:center;
  user-select:none;
  overflow-x:hidden;
}

h1{
  margin:14px 0 5px;
  font-size:34px;
}

#stats{
  font-size:20px;
  font-weight:bold;
  margin-bottom:8px;
}

.controls{
  margin:8px;
}

button,
select{
  border:0;
  padding:10px 15px;
  border-radius:11px;
  font-size:15px;
  font-weight:bold;
  cursor:pointer;
  margin:3px;
}

button:hover,
select:hover{
  transform:scale(1.04);
}

#startBtn{
  background:#facc15;
  color:#111;
}

#gameWrap{
  position:relative;
  width:min(430px,96vw);
  margin:auto;
}

canvas{
  display:block;
  width:100%;
  height:auto;
  border:4px solid white;
  border-radius:18px;
  box-shadow:0 0 30px rgba(0,0,0,.5);
  touch-action:none;
  cursor:pointer;
}

#overlay{
  position:absolute;
  inset:0;
  display:flex;
  align-items:center;
  justify-content:center;
  background:rgba(0,0,0,.45);
  border-radius:18px;
  pointer-events:none;
}

#overlayBox{
  background:rgba(15,23,42,.95);
  border:2px solid white;
  border-radius:18px;
  padding:22px;
  width:86%;
  max-width:350px;
}

#overlayTitle{
  font-size:30px;
  font-weight:bold;
  margin-bottom:10px;
}

#overlayText{
  line-height:1.5;
}

#message{
  min-height:28px;
  font-size:19px;
  font-weight:bold;
}

#tip{
  opacity:.75;
}
</style>
</head>

<body>

<h1>🐦 FLAPPY BIRD</h1>

<div id="stats">
  ⭐ Score: <span id="score">0</span>
  &nbsp; | &nbsp;
  🏆 Best: <span id="best">0</span>
</div>

<div class="controls">

  <label>
    Difficulty:
    <select id="difficulty">
      <option value="easy">😎 Easy</option>
      <option value="medium" selected>🔥 Medium</option>
      <option value="hard">💀 Hard</option>
    </select>
  </label>

  <button onclick="restartGame()">🔄 Restart</button>
  <button onclick="togglePause()">⏸ Pause</button>

</div>

<div id="gameWrap">

<canvas id="game" width="430" height="650"></canvas>

<div id="overlay">

  <div id="overlayBox">

    <div id="overlayTitle">🐦 FLAPPY BIRD</div>

    <div id="overlayText">
      Choose your difficulty above.<br><br>
      SPACE / CLICK / TAP = FLAP
      <br><br>
      Let's see how far you can get 💀
    </div>

  </div>

</div>

</div>

<p id="message"></p>

<p id="tip">
SPACE • CLICK • TAP = FLAP &nbsp; | &nbsp; P = PAUSE
</p>


<script>

const canvas=document.getElementById("game");
const ctx=canvas.getContext("2d");

const scoreEl=document.getElementById("score");
const bestEl=document.getElementById("best");
const messageEl=document.getElementById("message");
const difficultyEl=document.getElementById("difficulty");

let bird;
let pipes=[];
let particles=[];
let clouds=[];

let score=0;

let best=Number(
  localStorage.getItem("malikhiFlappyBest")||0
);

let state="start";
let paused=false;

let spawnTimer=0;
let lastTime=0;
let animationId;

bestEl.textContent=best;


/* =========================
   DIFFICULTY SETTINGS
========================= */

function getSettings(){

  const difficulty=difficultyEl.value;

  if(difficulty==="easy"){

    return{

      /*
        Slightly harder than
        the old easy mode.
      */

      gap:205,
      minGap:145,

      speed:2.25,
      maxSpeed:4.1,

      gravity:.34,
      flap:-6.8,

      spawn:122,

      shrinkEvery:5,
      shrinkAmount:4

    };

  }


  if(difficulty==="hard"){

    return{

      gap:160,
      minGap:105,

      speed:3.15,
      maxSpeed:6.0,

      gravity:.43,
      flap:-7.15,

      spawn:102,

      shrinkEvery:3,
      shrinkAmount:6

    };

  }


  /* MEDIUM */

  return{

    gap:185,
    minGap:120,

    speed:2.65,
    maxSpeed:5.1,

    gravity:.38,
    flap:-7.0,

    spawn:112,

    shrinkEvery:4,
    shrinkAmount:5

  };

}



/* =========================
   BIRD
========================= */

function resetBird(){

  bird={
    x:105,
    y:300,
    r:17,
    vy:0,
    rotation:0,
    wing:0
  };

}



/* =========================
   BACKGROUND
========================= */

function makeClouds(){

  clouds=[];

  for(let i=0;i<7;i++){

    clouds.push({

      x:Math.random()*430,

      y:35+Math.random()*220,

      size:25+Math.random()*35,

      speed:.15+Math.random()*.35

    });

  }

}



/* =========================
   START / RESTART
========================= */

function restartGame(){

  cancelAnimationFrame(animationId);

  score=0;

  scoreEl.textContent=0;

  pipes=[];
  particles=[];

  spawnTimer=0;

  paused=false;

  state="playing";

  resetBird();
  makeClouds();

  overlay.style.display="none";

  messageEl.textContent="";

  lastTime=performance.now();

  animationId=
    requestAnimationFrame(loop);

}



/* =========================
   FLAP
========================= */

function flap(){

  if(state==="start" || state==="dead"){

    restartGame();

  }

  if(state!=="playing" || paused)return;

  const s=getSettings();

  bird.vy=s.flap;

  bird.wing=1;


  for(let i=0;i<8;i++){

    particles.push({

      x:bird.x-12,

      y:bird.y+(Math.random()-.5)*8,

      vx:-1-Math.random()*2,

      vy:(Math.random()-.5)*2,

      life:20,

      size:2+Math.random()*3

    });

  }

}



/* =========================
   INPUT
========================= */

document.addEventListener("keydown",e=>{

  if(e.code==="Space"){

    e.preventDefault();

    flap();

  }

  if(e.code==="KeyP"){

    togglePause();

  }

});


canvas.addEventListener(
  "mousedown",
  flap
);


canvas.addEventListener(
  "touchstart",
  e=>{

    e.preventDefault();

    flap();

  },
  {passive:false}
);



/* =========================
   PAUSE
========================= */

function togglePause(){

  if(state!=="playing")return;

  paused=!paused;

  if(paused){

    overlay.style.display="flex";

    document.getElementById(
      "overlayTitle"
    ).textContent="⏸ PAUSED";

    document.getElementById(
      "overlayText"
    ).textContent=
      "Press P or Pause to continue.";

  }
  else{

    overlay.style.display="none";

    lastTime=performance.now();

  }

}



/* =========================
   SPAWN PIPE
========================= */

function spawnPipe(){

  const s=getSettings();


  /*
    Gap slowly gets smaller.
  */

  let gap=
    s.gap-
    Math.floor(score/s.shrinkEvery)*
    s.shrinkAmount;


  gap=Math.max(
    s.minGap,
    gap
  );


  /*
    Keep pipes away from
    impossible top/bottom edges.
  */

  const topMin=55;

  const bottomMin=75;

  const maxTop=
    canvas.height-
    50-
    bottomMin-
    gap;


  const top=
    topMin+
    Math.random()*
    Math.max(1,maxTop-topMin);


  pipes.push({

    x:canvas.width+25,

    top:top,

    gap:gap,

    width:66,

    passed:false

  });

}



/* =========================
   UPDATE
========================= */

function update(dt){

  if(paused || state!=="playing")return;

  dt=Math.min(dt,1.8);

  const s=getSettings();


  /*
    GRAVITY
  */

  bird.vy+=s.gravity*dt;

  bird.y+=bird.vy*dt;


  bird.rotation=
    Math.max(
      -.55,
      Math.min(
        1.15,
        bird.vy/8
      )
    );


  bird.wing*=.86;


  /*
    PIPE SPEED
  */

  const speed=
    Math.min(
      s.speed+
      score*.055,
      s.maxSpeed
    );


  /*
    MOVE PIPES
  */

  for(const p of pipes){

    p.x-=speed*dt;


    if(
      !p.passed &&
      p.x+p.width<bird.x
    ){

      p.passed=true;

      score++;

      scoreEl.textContent=score;

    }

  }


  /*
    PIPE SPAWN
  */

  spawnTimer+=dt;


  const spawnRate=
    Math.max(
      82,
      s.spawn-score*.65
    );


  if(spawnTimer>=spawnRate){

    spawnPipe();

    spawnTimer=0;

  }


  pipes=
    pipes.filter(
      p=>p.x+p.width>-35
    );


  /*
    CLOUDS
  */

  for(const c of clouds){

    c.x-=c.speed*dt;

    if(c.x<-120){

      c.x=canvas.width+80;

    }

  }


  /*
    PARTICLES
  */

  for(const p of particles){

    p.x+=p.vx*dt;

    p.y+=p.vy*dt;

    p.life-=dt;

  }


  particles=
    particles.filter(
      p=>p.life>0
    );


  /*
    WALLS
  */

  const ground=
    canvas.height-50;


  if(
    bird.y-bird.r<=0 ||
    bird.y+bird.r>=ground
  ){

    gameOver();

    return;

  }


  /*
    PIPES
  */

  for(const p of pipes){

    const bottom=
      p.top+p.gap;


    const hitX=
      bird.x+bird.r>p.x &&
      bird.x-bird.r<p.x+p.width;


    if(hitX){

      if(
        bird.y-bird.r<p.top ||
        bird.y+bird.r>bottom
      ){

        gameOver();

        return;

      }

    }

  }

}



/* =========================
   GAME OVER
========================= */

function gameOver(){

  if(state!=="playing")return;

  state="dead";

  let newRecord=false;

  if(score>best){

    best=score;

    newRecord=true;

    localStorage.setItem(
      "malikhiFlappyBest",
      best
    );

    bestEl.textContent=best;

  }


  overlay.style.display="flex";


  document.getElementById(
    "overlayTitle"
  ).textContent=
    newRecord
    ? "🏆 NEW RECORD!"
    : "💀 GAME OVER";


  document.getElementById(
    "overlayText"
  ).innerHTML=

    "Score: <b>"+score+"</b><br>"+
    "Best: <b>"+best+"</b><br><br>"+

    (
      newRecord
      ? "YOU BEAT YOUR HIGH SCORE 🔥"
      : "Try to beat your record!"
    )+

    "<br><br>"+
    "Click, tap, or SPACE to play again.";

}



/* =========================
   DRAW BACKGROUND
========================= */

function drawBackground(){

  const night=
    score>=12 &&
    Math.floor(score/12)%2===1;


  ctx.fillStyle=
    night
    ?"#172554"
    :"#38bdf8";


  ctx.fillRect(
    0,
    0,
    canvas.width,
    canvas.height
  );


  /*
    SUN / MOON
  */

  ctx.fillStyle=
    night
    ?"#f8fafc"
    :"#fde047";


  ctx.beginPath();

  ctx.arc(
    night?345:70,
    75,
    30,
    0,
    Math.PI*2
  );

  ctx.fill();


  /*
    STARS
  */

  if(night){

    ctx.fillStyle="white";

    for(let i=0;i<40;i++){

      const x=(i*83)%430;
      const y=(i*47)%280;

      ctx.fillRect(
        x,
        y,
        2,
        2
      );

    }

  }


  /*
    CLOUDS
  */

  if(!night){

    ctx.fillStyle=
      "rgba(255,255,255,.8)";


    for(const c of clouds){

      ctx.beginPath();

      ctx.arc(
        c.x,
        c.y,
        c.size*.45,
        0,
        Math.PI*2
      );

      ctx.arc(
        c.x+c.size*.55,
        c.y+4,
        c.size*.65,
        0,
        Math.PI*2
      );

      ctx.arc(
        c.x+c.size,
        c.y,
        c.size*.42,
        0,
        Math.PI*2
      );

      ctx.fill();

    }

  }

}



/* =========================
   DRAW PIPES
========================= */

function drawPipes(){

  for(const p of pipes){

    const bottom=
      p.top+p.gap;


    /*
      SHADOW
    */

    ctx.fillStyle=
      "rgba(0,0,0,.2)";


    ctx.fillRect(
      p.x+6,
      0,
      p.width,
      p.top
    );


    ctx.fillRect(
      p.x+6,
      bottom,
      p.width,
      canvas.height-bottom-50
    );


    /*
      PIPE BODY
    */

    ctx.fillStyle="#16a34a";


    ctx.fillRect(
      p.x,
      0,
      p.width,
      p.top
    );


    ctx.fillRect(
      p.x,
      bottom,
      p.width,
      canvas.height-bottom-50
    );


    /*
      DARK EDGE
    */

    ctx.fillStyle="#15803d";


    ctx.fillRect(
      p.x,
      0,
      7,
      p.top
    );


    ctx.fillRect(
      p.x,
      bottom,
      7,
      canvas.height-bottom-50
    );


    /*
      HIGHLIGHT
    */

    ctx.fillStyle="#4ade80";


    ctx.fillRect(
      p.x+11,
      0,
      9,
      Math.max(
        0,
        p.top-23
      )
    );


    ctx.fillRect(
      p.x+11,
      bottom+23,
      9,
      Math.max(
        0,
        canvas.height-bottom-73
      )
    );


    /*
      CAPS
    */

    ctx.fillStyle="#15803d";


    ctx.fillRect(
      p.x-7,
      p.top-23,
      p.width+14,
      23
    );


    ctx.fillRect(
      p.x-7,
      bottom,
      p.width+14,
      23
    );


    /*
      CAP HIGHLIGHT
    */

    ctx.fillStyle="#22c55e";


    ctx.fillRect(
      p.x-3,
      p.top-20,
      p.width+6,
      5
    );


    ctx.fillRect(
      p.x-3,
      bottom+3,
      p.width+6,
      5
    );

  }

}



/* =========================
   DRAW BIRD
========================= */

function drawBird(){

  ctx.save();

  ctx.translate(
    bird.x,
    bird.y
  );

  ctx.rotate(
    bird.rotation
  );


  /*
    TAIL
  */

  ctx.fillStyle="#f97316";

  ctx.beginPath();

  ctx.moveTo(-13,4);
  ctx.lineTo(-30,12);
  ctx.lineTo(-17,-4);

  ctx.closePath();

  ctx.fill();


  /*
    BODY
  */

  ctx.fillStyle="#facc15";

  ctx.beginPath();

  ctx.arc(
    0,
    0,
    bird.r,
    0,
    Math.PI*2
  );

  ctx.fill();


  /*
    WING
  */

  ctx.fillStyle="#eab308";

  ctx.beginPath();

  ctx.ellipse(
    -5,
    5+bird.wing*4,
    12,
    6,
    -.3,
    0,
    Math.PI*2
  );

  ctx.fill();


  /*
    EYE
  */

  ctx.fillStyle="white";

  ctx.beginPath();

  ctx.arc(
    7,
    -7,
    7,
    0,
    Math.PI*2
  );

  ctx.fill();


  ctx.fillStyle="#111";

  ctx.beginPath();

  ctx.arc(
    9,
    -7,
    3,
    0,
    Math.PI*2
  );

  ctx.fill();


  /*
    BEAK
  */

  ctx.fillStyle="#f97316";

  ctx.beginPath();

  ctx.moveTo(15,-2);

  ctx.lineTo(31,5);

  ctx.lineTo(15,11);

  ctx.closePath();

  ctx.fill();


  ctx.restore();

}



/* =========================
   PARTICLES
========================= */

function drawParticles(){

  for(const p of particles){

    ctx.globalAlpha=
      p.life/20;

    ctx.fillStyle="#fde047";

    ctx.fillRect(
      p.x,
      p.y,
      p.size,
      p.size
    );

  }

  ctx.globalAlpha=1;

}



/* =========================
   GROUND
========================= */

function drawGround(){

  const y=
    canvas.height-50;


  ctx.fillStyle="#65a30d";

  ctx.fillRect(
    0,
    y,
    canvas.width,
    50
  );


  ctx.fillStyle="#84cc16";

  ctx.fillRect(
    0,
    y,
    canvas.width,
    9
  );


  ctx.fillStyle="#4d7c0f";


  for(
    let x=0;
    x<canvas.width;
    x+=22
  ){

    ctx.fillRect(
      x,
      y+16,
      10,
      5
    );

    ctx.fillRect(
      x+12,
      y+34,
      8,
      5
    );

  }

}



/* =========================
   DRAW
========================= */

function draw(){

  ctx.clearRect(
    0,
    0,
    canvas.width,
    canvas.height
  );

  drawBackground();

  drawPipes();

  drawGround();

  drawParticles();

  drawBird();

}



/* =========================
   LOOP
========================= */

function loop(time){

  if(state!=="playing"){

    draw();

    return;

  }


  let dt=
    (time-lastTime)/16.67;


  lastTime=time;


  dt=Math.min(dt,2);


  update(dt);

  draw();


  animationId=
    requestAnimationFrame(loop);

}



/* =========================
   INITIAL SCREEN
========================= */

resetBird();

makeClouds();

draw();

</script>

</body>
</html>
