<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Flappy Bird - Malikhi Games</title>

<style>
*{box-sizing:border-box}

body{
  margin:0;
  background:#111827;
  color:white;
  font-family:Arial,sans-serif;
  text-align:center;
  user-select:none;
  overflow-x:hidden;
}

h1{
  margin:14px 0 5px;
  font-size:34px;
}

#stats{
  font-size:20px;
  font-weight:bold;
  margin-bottom:8px;
}

.controls{
  margin:8px;
}

button{
  border:0;
  padding:10px 16px;
  border-radius:11px;
  font-size:16px;
  font-weight:bold;
  cursor:pointer;
  margin:3px;
}

button:hover{
  transform:scale(1.05);
}

#gameWrap{
  position:relative;
  width:min(430px,96vw);
  margin:auto;
}

canvas{
  display:block;
  width:100%;
  height:auto;
  border:4px solid white;
  border-radius:18px;
  box-shadow:0 0 30px rgba(0,0,0,.5);
  touch-action:none;
  cursor:pointer;
}

#overlay{
  position:absolute;
  inset:0;
  display:flex;
  align-items:center;
  justify-content:center;
  background:rgba(0,0,0,.45);
  border-radius:18px;
  pointer-events:none;
}

#overlayBox{
  background:rgba(15,23,42,.94);
  border:2px solid white;
  border-radius:18px;
  padding:22px;
  width:85%;
  max-width:350px;
}

#overlayTitle{
  font-size:30px;
  font-weight:bold;
  margin-bottom:10px;
}

#overlayText{
  line-height:1.5;
}

#message{
  min-height:28px;
  font-size:19px;
  font-weight:bold;
}

#tip{
  opacity:.75;
}
</style>
</head>

<body>

<h1>🐦 FLAPPY BIRD</h1>

<div id="stats">
  ⭐ Score: <span id="score">0</span>
  &nbsp; | &nbsp;
  🏆 Best: <span id="best">0</span>
</div>

<div class="controls">
  <button onclick="restartGame()">🔄 Restart</button>
  <button onclick="togglePause()">⏸ Pause</button>
</div>

<div id="gameWrap">

<canvas id="game" width="430" height="650"></canvas>

<div id="overlay">

  <div id="overlayBox">

    <div id="overlayTitle">🐦 FLAPPY BIRD</div>

    <div id="overlayText">
      SPACE / CLICK / TAP to flap.<br><br>
      ⚠️ HARD MODE<br>
      The pipes get faster and the gaps get smaller.
      <br><br>
      Good luck 💀
    </div>

  </div>

</div>

</div>

<p id="message"></p>
<p id="tip">SPACE • CLICK • TAP = FLAP | P = PAUSE</p>

<script>

const canvas=document.getElementById("game");
const ctx=canvas.getContext("2d");

const scoreEl=document.getElementById("score");
const bestEl=document.getElementById("best");
const messageEl=document.getElementById("message");

let bird;
let pipes=[];
let particles=[];
let clouds=[];

let score=0;
let best=Number(localStorage.getItem("malikhiFlappyBest")||0);

let state="start";
let paused=false;

let spawnTimer=0;
let lastTime=0;
let animationId;

bestEl.textContent=best;



/* =========================
   BIRD
========================= */

function resetBird(){

  bird={
    x:105,
    y:300,
    r:17,
    vy:0,
    rotation:0,
    wing:0
  };

}



/* =========================
   BACKGROUND
========================= */

function makeClouds(){

  clouds=[];

  for(let i=0;i<7;i++){

    clouds.push({
      x:Math.random()*430,
      y:40+Math.random()*220,
      size:25+Math.random()*35,
      speed:.15+Math.random()*.35
    });

  }

}



/* =========================
   START
========================= */

function restartGame(){

  cancelAnimationFrame(animationId);

  score=0;
  scoreEl.textContent=0;

  pipes=[];
  particles=[];

  spawnTimer=0;

  paused=false;
  state="playing";

  resetBird();
  makeClouds();

  overlay.style.display="none";
  messageEl.textContent="";

  lastTime=performance.now();

  animationId=requestAnimationFrame(loop);

}



/* =========================
   FLAP
========================= */

function flap(){

  if(state==="start"||state==="dead"){

    restartGame();

  }

  if(state!=="playing"||paused)return;

  /*
    Harder jump:
    stronger gravity + shorter flap
  */

  bird.vy=-6.9;
  bird.wing=1;

  for(let i=0;i<7;i++){

    particles.push({
      x:bird.x-12,
      y:bird.y,
      vx:-1-Math.random()*2,
      vy:(Math.random()-.5)*2,
      life:20
    });

  }

}



/* =========================
   INPUT
========================= */

document.addEventListener("keydown",e=>{

  if(e.code==="Space"){

    e.preventDefault();
    flap();

  }

  if(e.code==="KeyP"){

    togglePause();

  }

});

canvas.addEventListener("mousedown",flap);

canvas.addEventListener(
  "touchstart",
  e=>{
    e.preventDefault();
    flap();
  },
  {passive:false}
);



/* =========================
   PAUSE
========================= */

function togglePause(){

  if(state!=="playing")return;

  paused=!paused;

  if(paused){

    overlay.style.display="flex";

    document.getElementById("overlayTitle").textContent="⏸ PAUSED";

    document.getElementById("overlayText").textContent=
      "Press P or Pause to keep flying.";

  }else{

    overlay.style.display="none";

    lastTime=performance.now();

  }

}



/* =========================
   PIPE SPAWNING
========================= */

function spawnPipe(){

  /*
    Starts difficult and gets MUCH harder.
  */

  let gap=175;

  /*
    Every 4 points the gap shrinks.
  */

  gap-=Math.floor(score/4)*7;

  /*
    Minimum gap = 105.
  */

  gap=Math.max(105,gap);

  const topMin=55;

  const bottomMin=75;

  const maxTop=
    canvas.height-
    55-
    bottomMin-
    gap;

  const top=
    topMin+
    Math.random()*(maxTop-topMin);

  pipes.push({

    x:canvas.width+20,

    top:top,

    gap:gap,

    width:65,

    passed:false

  });

}



/* =========================
   UPDATE
========================= */

function update(dt){

  if(paused||state!=="playing")return;

  /*
    HARD GRAVITY
  */

  bird.vy+=0.39*dt;

  bird.y+=bird.vy*dt;

  bird.rotation=
    Math.max(
      -.6,
      Math.min(1.25,bird.vy/8)
    );


  /*
    SPEED RAMPS UP FAST
  */

  let speed=
    2.8+
    Math.min(score*.045,2.7);


  /*
    MOVE PIPES
  */

  for(const p of pipes){

    p.x-=speed*dt;

    if(
      !p.passed &&
      p.x+p.width<bird.x
    ){

      p.passed=true;

      score++;

      scoreEl.textContent=score;

    }

  }


  /*
    MUCH MORE FREQUENT PIPES
  */

  spawnTimer+=dt;

  let spawnRate=
    Math.max(
      92,
      112-score*.45
    );

  if(spawnTimer>=spawnRate){

    spawnPipe();

    spawnTimer=0;

  }


  pipes=pipes.filter(
    p=>p.x+p.width>-30
  );


  /*
    CLOUDS
  */

  for(const c of clouds){

    c.x-=c.speed*dt;

    if(c.x<-120){

      c.x=canvas.width+80;

    }

  }


  /*
    PARTICLES
  */

  for(const p of particles){

    p.x+=p.vx*dt;
    p.y+=p.vy*dt;
    p.life-=dt;

  }

  particles=
    particles.filter(
      p=>p.life>0
    );


  /*
    WALL COLLISION
  */

  const ground=canvas.height-50;

  if(
    bird.y-bird.r<=0 ||
    bird.y+bird.r>=ground
  ){

    gameOver();
    return;

  }


  /*
    PIPE COLLISION
  */

  for(const p of pipes){

    const bottom=
      p.top+p.gap;

    const insideX=
      bird.x+bird.r>p.x &&
      bird.x-bird.r<p.x+p.width;

    if(insideX){

      if(
        bird.y-bird.r<p.top ||
        bird.y+bird.r>bottom
      ){

        gameOver();
        return;

      }

    }

  }

}



/* =========================
   GAME OVER
========================= */

function gameOver(){

  if(state!=="playing")return;

  state="dead";

  if(score>best){

    best=score;

    localStorage.setItem(
      "malikhiFlappyBest",
      best
    );

    bestEl.textContent=best;

  }

  overlay.style.display="flex";

  document.getElementById(
    "overlayTitle"
  ).textContent="💀 GAME OVER";

  document.getElementById(
    "overlayText"
  ).innerHTML=
    "Score: <b>"+score+"</b><br>"+
    "Best: <b>"+best+"</b><br><br>"+
    "Click, tap, or press SPACE to try again.";

}



/* =========================
   BACKGROUND DRAW
========================= */

function drawBackground(){

  let night=
    score>=12 &&
    Math.floor(score/12)%2===1;

  ctx.fillStyle=
    night
    ?"#172554"
    :"#38bdf8";

  ctx.fillRect(
    0,
    0,
    canvas.width,
    canvas.height
  );


  /*
    SUN / MOON
  */

  ctx.fillStyle=
    night
    ?"#f8fafc"
    :"#fde047";

  ctx.beginPath();

  ctx.arc(
    night?345:70,
    75,
    30,
    0,
    Math.PI*2
  );

  ctx.fill();


  /*
    STARS
  */

  if(night){

    ctx.fillStyle="white";

    for(let i=0;i<40;i++){

      let x=(i*83)%430;
      let y=(i*47)%280;

      ctx.fillRect(x,y,2,2);

    }

  }


  /*
    CLOUDS
  */

  if(!night){

    ctx.fillStyle=
      "rgba(255,255,255,.8)";

    for(const c of clouds){

      ctx.beginPath();

      ctx.arc(
        c.x,
        c.y,
        c.size*.45,
        0,
        Math.PI*2
      );

      ctx.arc(
        c.x+c.size*.55,
        c.y+4,
        c.size*.65,
        0,
        Math.PI*2
      );

      ctx.arc(
        c.x+c.size,
        c.y,
        c.size*.42,
        0,
        Math.PI*2
      );

      ctx.fill();

    }

  }

}



/* =========================
   PIPES DRAW
========================= */

function drawPipes(){

  for(const p of pipes){

    const bottom=
      p.top+p.gap;


    /*
      SHADOW
    */

    ctx.fillStyle=
      "rgba(0,0,0,.2)";

    ctx.fillRect(
      p.x+6,
      0,
      p.width,
      p.top
    );

    ctx.fillRect(
      p.x+6,
      bottom,
      p.width,
      canvas.height-bottom-50
    );


    /*
      PIPE BODY
    */

    ctx.fillStyle="#16a34a";

    ctx.fillRect(
      p.x,
      0,
      p.width,
      p.top
    );

    ctx.fillRect(
      p.x,
      bottom,
      p.width,
      canvas.height-bottom-50
    );


    /*
      DARK EDGE
    */

    ctx.fillStyle="#15803d";

    ctx.fillRect(
      p.x,
      0,
      7,
      p.top
    );

    ctx.fillRect(
      p.x,
      bottom,
      7,
      canvas.height-bottom-50
    );


    /*
      HIGHLIGHT
    */

    ctx.fillStyle="#4ade80";

    ctx.fillRect(
      p.x+11,
      0,
      9,
      Math.max(0,p.top-22)
    );

    ctx.fillRect(
      p.x+11,
      bottom+22,
      9,
      canvas.height-bottom-72
    );


    /*
      TOP CAPS
    */

    ctx.fillStyle="#15803d";

    ctx.fillRect(
      p.x-7,
      p.top-23,
      p.width+14,
      23
    );

    ctx.fillRect(
      p.x-7,
      bottom,
      p.width+14,
      23
    );


    /*
      CAP HIGHLIGHT
    */

    ctx.fillStyle="#22c55e";

    ctx.fillRect(
      p.x-3,
      p.top-20,
      p.width+6,
      5
    );

    ctx.fillRect(
      p.x-3,
      bottom+3,
      p.width+6,
      5
    );

  }

}



/* =========================
   BIRD DRAW
========================= */

function drawBird(){

  ctx.save();

  ctx.translate(
    bird.x,
    bird.y
  );

  ctx.rotate(
    bird.rotation
  );


  /*
    TAIL
  */

  ctx.fillStyle="#f97316";

  ctx.beginPath();

  ctx.moveTo(-13,4);
  ctx.lineTo(-29,12);
  ctx.lineTo(-17,-4);

  ctx.closePath();

  ctx.fill();


  /*
    BODY
  */

  ctx.fillStyle="#facc15";

  ctx.beginPath();

  ctx.arc(
    0,
    0,
    bird.r,
    0,
    Math.PI*2
  );

  ctx.fill();


  /*
    WING
  */

  ctx.fillStyle="#eab308";

  ctx.beginPath();

  ctx.ellipse(
    -5,
    5+bird.wing*4,
    12,
    6,
    -.3,
    0,
    Math.PI*2
  );

  ctx.fill();


  /*
    EYE
  */

  ctx.fillStyle="white";

  ctx.beginPath();

  ctx.arc(
    7,
    -7,
    7,
    0,
    Math.PI*2
  );

  ctx.fill();

  ctx.fillStyle="#111";

  ctx.beginPath();

  ctx.arc(
    9,
    -7,
    3,
    0,
    Math.PI*2
  );

  ctx.fill();


  /*
    BEAK
  */

  ctx.fillStyle="#f97316";

  ctx.beginPath();

  ctx.moveTo(15,-2);
  ctx.lineTo(31,5);
  ctx.lineTo(15,11);

  ctx.closePath();

  ctx.fill();

  ctx.restore();

}



/* =========================
   PARTICLES
========================= */

function drawParticles(){

  for(const p of particles){

    ctx.globalAlpha=
      p.life/20;

    ctx.fillStyle="#fde047";

    ctx.fillRect(
      p.x,
      p.y,
      4,
      4
    );

  }

  ctx.globalAlpha=1;

}



/* =========================
   GROUND
========================= */

function drawGround(){

  const y=
    canvas.height-50;

  ctx.fillStyle="#65a30d";

  ctx.fillRect(
    0,
    y,
    canvas.width,
    50
  );

  ctx.fillStyle="#84cc16";

  ctx.fillRect(
    0,
    y,
    canvas.width,
    9
  );

  ctx.fillStyle="#4d7c0f";

  for(let x=0;x<canvas.width;x+=22){

    ctx.fillRect(
      x,
      y+16,
      10,
      5
    );

    ctx.fillRect(
      x+12,
      y+34,
      8,
      5
    );

  }

}



/* =========================
   DRAW
========================= */

function draw(){

  ctx.clearRect(
    0,
    0,
    canvas.width,
    canvas.height
  );

  drawBackground();
  drawPipes();
  drawGround();
  drawParticles();
  drawBird();

}



/* =========================
   LOOP
========================= */

function loop(time){

  if(state!=="playing"){

    draw();
    return;

  }

  let dt=
    (time-lastTime)/16.67;

  lastTime=time;

  dt=Math.min(dt,2);

  update(dt);

  draw();

  animationId=
    requestAnimationFrame(loop);

}



/* =========================
   INITIAL SCREEN
========================= */

resetBird();
makeClouds();
draw();

</script>

</body>
</html>
