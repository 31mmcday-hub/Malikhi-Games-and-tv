<!doctype html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Flappy Bird - Malikhi Games</title>

<style>
*{box-sizing:border-box}

body{
margin:0;
background:#111827;
color:white;
font-family:Arial,sans-serif;
text-align:center;
overflow-x:hidden;
user-select:none;
}

h1{
margin:12px 0 4px;
font-size:32px;
}

#stats{
font-size:20px;
font-weight:bold;
margin-bottom:8px;
}

#gameWrap{
position:relative;
width:min(430px,96vw);
margin:auto;
}

canvas{
display:block;
width:100%;
height:auto;
border:4px solid white;
border-radius:18px;
box-shadow:0 0 30px rgba(0,0,0,.5);
touch-action:none;
cursor:pointer;
}

#overlay{
position:absolute;
inset:0;
display:flex;
align-items:center;
justify-content:center;
pointer-events:none;
padding:25px;
}

#overlayBox{
background:rgba(0,0,0,.55);
backdrop-filter:blur(5px);
border:2px solid rgba(255,255,255,.5);
border-radius:18px;
padding:20px;
max-width:300px;
}

#overlayTitle{
font-size:28px;
font-weight:bold;
margin-bottom:8px;
}

#overlayText{
font-size:16px;
line-height:1.5;
}

.controls{
margin:10px;
}

button{
border:0;
padding:10px 16px;
border-radius:12px;
font-size:16px;
font-weight:bold;
cursor:pointer;
margin:3px;
}

button:hover{
transform:scale(1.05);
}

#difficulty{
font-size:16px;
padding:9px;
border-radius:10px;
margin:5px;
}

#tip{
opacity:.8;
margin:5px 0 15px;
}
</style>
</head>

<body>

<h1>🐦 FLAPPY BIRD</h1>

<div id="stats">
Score: <span id="score">0</span>
&nbsp; | &nbsp;
Best: <span id="best">0</span>
</div>

<div class="controls">
Difficulty:
<select id="difficulty">
<option value="easy">Easy 😎</option>
<option value="medium">Medium 🔥</option>
<option value="hard">Hard 💀</option>
</select>

<button onclick="restartGame()">🔄 Restart</button>
<button onclick="togglePause()">⏸ Pause</button>
<button onclick="toggleSound()">🔊 Sound</button>
</div>

<div id="gameWrap">

<canvas id="game" width="430" height="650"></canvas>

<div id="overlay">
<div id="overlayBox">
<div id="overlayTitle">🐦 FLAPPY BIRD</div>
<div id="overlayText">
Press SPACE, click, or tap to start!<br><br>
Fly through the pipes and beat your best score 🔥
</div>
</div>
</div>

</div>

<p id="tip">SPACE • CLICK • TAP = FLAP | P = PAUSE</p>

<script>

const canvas=document.getElementById("game");
const ctx=canvas.getContext("2d");

const scoreEl=document.getElementById("score");
const bestEl=document.getElementById("best");
const overlay=document.getElementById("overlay");
const overlayTitle=document.getElementById("overlayTitle");
const overlayText=document.getElementById("overlayText");
const difficultyEl=document.getElementById("difficulty");

let bird;
let pipes=[];
let particles=[];
let clouds=[];
let hills=[];
let score=0;
let best=Number(localStorage.getItem("malikhiFlappyBest")||0);

let state="start";
let paused=false;
let soundOn=true;

let spawnTimer=0;
let animationId=null;
let lastTime=0;

const audioCtx=window.AudioContext||window.webkitAudioContext;
let audio=null;

bestEl.textContent=best;



/* ---------------- SOUND ---------------- */

function beep(freq,duration,type="sine",volume=.05){

if(!soundOn)return;

try{

if(!audio)audio=new audioCtx();

const osc=audio.createOscillator();
const gain=audio.createGain();

osc.type=type;
osc.frequency.value=freq;

gain.gain.value=volume;

osc.connect(gain);
gain.connect(audio.destination);

osc.start();

gain.gain.exponentialRampToValueAtTime(
0.001,
audio.currentTime+duration
);

osc.stop(audio.currentTime+duration);

}catch(e){}

}

function flapSound(){
beep(500,.08,"square",.04);
}

function scoreSound(){
beep(850,.12,"sine",.06);
}

function hitSound(){
beep(120,.3,"sawtooth",.08);
}



/* ---------------- DIFFICULTY ---------------- */

function settings(){

const d=difficultyEl.value;

if(d==="easy"){
return{
gap:225,
speed:2.05,
gravity:.31,
flap:-6.5,
spawn:145
};
}

if(d==="medium"){
return{
gap:190,
speed:2.5,
gravity:.36,
flap:-6.8,
spawn:130
};
}

return{
gap:160,
speed:3,
gravity:.42,
flap:-7.1,
spawn:115
};

}



/* ---------------- BIRD ---------------- */

function resetBird(){

bird={
x:105,
y:300,
r:18,
vy:0,
rotation:0,
wing:0
};

}



/* ---------------- BACKGROUND ---------------- */

function makeBackground(){

clouds=[];
hills=[];

for(let i=0;i<7;i++){

clouds.push({
x:Math.random()*canvas.width,
y:30+Math.random()*220,
size:25+Math.random()*35,
speed:.15+Math.random()*.3
});

}

for(let i=0;i<5;i++){

hills.push({
x:i*130,
h:70+Math.random()*70
});

}

}



/* ---------------- RESET ---------------- */

function restartGame(){

cancelAnimationFrame(animationId);

score=0;
scoreEl.textContent=0;

pipes=[];
particles=[];
spawnTimer=0;

paused=false;
state="playing";

resetBird();
makeBackground();

overlay.style.display="none";

lastTime=performance.now();

animationId=requestAnimationFrame(loop);

}



/* ---------------- START ---------------- */

function startGame(){

if(state==="start"||state==="dead"){

restartGame();

setTimeout(flap,30);

}

}



/* ---------------- FLAP ---------------- */

function flap(){

if(state==="start"||state==="dead"){
startGame();
return;
}

if(state!=="playing"||paused)return;

bird.vy=settings().flap;

bird.wing=1;

for(let i=0;i<8;i++){

particles.push({
x:bird.x-15,
y:bird.y+(Math.random()-0.5)*10,
vx:-1-Math.random()*2,
vy:(Math.random()-0.5)*2,
life:22,
size:2+Math.random()*3
});

}

flapSound();

}



/* ---------------- PIPES ---------------- */

function spawnPipe(){

const s=settings();

let gap=s.gap-Math.min(score*1.2,35);

gap=Math.max(gap,120);

let padding=75;

let maxTop=canvas.height-75-gap-80;

let top=padding+Math.random()*(maxTop-padding);

pipes.push({
x:canvas.width+20,
top:top,
gap:gap,
width:68,
passed:false
});

}



/* ---------------- INPUT ---------------- */

document.addEventListener("keydown",e=>{

if(e.code==="Space"){

e.preventDefault();

flap();

}

if(e.code==="KeyP"){
togglePause();
}

});

canvas.addEventListener("mousedown",e=>{
e.preventDefault();
flap();
});

canvas.addEventListener("touchstart",e=>{
e.preventDefault();
flap();
},{passive:false});



/* ---------------- PAUSE ---------------- */

function togglePause(){

if(state!=="playing")return;

paused=!paused;

if(paused){

overlay.style.display="flex";
overlayTitle.textContent="⏸ PAUSED";
overlayText.textContent="Press P or the Pause button to continue";

}else{

overlay.style.display="none";

lastTime=performance.now();

}

}



/* ---------------- SOUND ---------------- */

function toggleSound(){

soundOn=!soundOn;

}



/* ---------------- GAME OVER ---------------- */

function gameOver(){

if(state!=="playing")return;

state="dead";

hitSound();

if(score>best){

best=score;

localStorage.setItem("malikhiFlappyBest",best);

bestEl.textContent=best;

}

overlay.style.display="flex";

let medal="🥉";

if(score>=10)medal="🥈";
if(score>=20)medal="🥇";
if(score>=40)medal="👑";

overlayTitle.textContent="💀 GAME OVER";

overlayText.innerHTML=
medal+" Score: <b>"+score+"</b><br>"+
"Best: <b>"+best+"</b><br><br>"+
"Click, tap, or press SPACE to try again";

}



/* ---------------- UPDATE ---------------- */

function update(dt){

if(paused||state!=="playing")return;

dt=Math.min(dt,1.8);

const s=settings();


/* Bird physics */

bird.vy+=s.gravity*dt;

bird.y+=bird.vy*dt;

bird.rotation=Math.max(
-.5,
Math.min(.9,bird.vy*.09)
);

bird.wing*=.86;


/* Pipe speed */

let pipeSpeed=s.speed+Math.min(score*.025,.8);

for(const p of pipes){

p.x-=pipeSpeed*dt;

if(!p.passed&&p.x+p.width<bird.x){

p.passed=true;

score++;

scoreEl.textContent=score;

scoreSound();

}

}


/* Spawn */

spawnTimer+=dt;

if(spawnTimer>s.spawn){

spawnPipe();

spawnTimer=0;

}


/* Remove old pipes */

pipes=pipes.filter(p=>p.x+p.width>-30);


/* Clouds */

for(const c of clouds){

c.x-=c.speed*dt;

if(c.x<-120){

c.x=canvas.width+100;
c.y=30+Math.random()*220;

}

}


/* Particles */

for(const p of particles){

p.x+=p.vx*dt;
p.y+=p.vy*dt;
p.life-=dt;

}

particles=particles.filter(p=>p.life>0);


/* Ground */

const groundY=canvas.height-55;

if(
bird.y-bird.r<0||
bird.y+bird.r>groundY
){

gameOver();

return;

}


/* Pipe collision */

for(const p of pipes){

const bottom=p.top+p.gap;

let hitX=
bird.x+bird.r>p.x+4&&
bird.x-bird.r<p.x+p.width-4;

if(hitX){

if(
bird.y-bird.r<p.top||
bird.y+bird.r>bottom
){

gameOver();

return;

}

}

}

}



/* ---------------- DRAW BACKGROUND ---------------- */

function drawBackground(){

let night=score>=15&&Math.floor(score/15)%2===1;

let sky=night?"#172554":"#38bdf8";

ctx.fillStyle=sky;

ctx.fillRect(0,0,canvas.width,canvas.height);


/* Sun or moon */

ctx.fillStyle=night?"#f8fafc":"#fde047";

ctx.beginPath();

ctx.arc(
night?340:75,
80,
32,
0,
Math.PI*2
);

ctx.fill();


/* Stars */

if(night){

ctx.fillStyle="white";

for(let i=0;i<35;i++){

let x=(i*79)%canvas.width;
let y=(i*47)%280;

ctx.fillRect(x,y,2,2);

}

}


/* Clouds */

if(!night){

ctx.fillStyle="rgba(255,255,255,.8)";

for(const c of clouds){

ctx.beginPath();

ctx.arc(c.x,c.y,c.size*.45,0,Math.PI*2);
ctx.arc(c.x+c.size*.55,c.y+4,c.size*.65,0,Math.PI*2);
ctx.arc(c.x+c.size*1.05,c.y,c.size*.42,0,Math.PI*2);

ctx.fill();

}

}


/* Hills */

ctx.fillStyle=night?"#14532d":"#22c55e";

for(const h of hills){

ctx.beginPath();

ctx.arc(
h.x,
canvas.height-40,
h.h,
Math.PI,
Math.PI*2
);

ctx.fill();

}

}



/* ---------------- DRAW PIPES ---------------- */

function drawPipes(){

for(const p of pipes){

let bottom=p.top+p.gap;


/* Shadow */

ctx.fillStyle="rgba(0,0,0,.18)";

ctx.fillRect(
p.x+6,
0,
p.width,
p.top
);

ctx.fillRect(
p.x+6,
bottom,
p.width,
canvas.height-bottom-55
);


/* Pipe body */

ctx.fillStyle="#16a34a";

ctx.fillRect(p.x,0,p.width,p.top);

ctx.fillRect(
p.x,
bottom,
p.width,
canvas.height-bottom-55
);


/* Pipe highlights */

ctx.fillStyle="#4ade80";

ctx.fillRect(
p.x+10,
0,
10,
Math.max(0,p.top-20)
);

ctx.fillRect(
p.x+10,
bottom+20,
10,
canvas.height-bottom-75
);


/* Caps */

ctx.fillStyle="#15803d";

ctx.fillRect(
p.x-7,
p.top-24,
p.width+14,
24
);

ctx.fillRect(
p.x-7,
bottom,
p.width+14,
24
);


/* Cap highlight */

ctx.fillStyle="#22c55e";

ctx.fillRect(
p.x-3,
p.top-22,
p.width+6,
6
);

ctx.fillRect(
p.x-3,
bottom,
p.width+6,
6
);

}

}



/* ---------------- DRAW BIRD ---------------- */

function drawBird(){

ctx.save();

ctx.translate(bird.x,bird.y);

ctx.rotate(bird.rotation);


/* Tail */

ctx.fillStyle="#f97316";

ctx.beginPath();

ctx.moveTo(-14,4);
ctx.lineTo(-30,12);
ctx.lineTo(-17,-4);

ctx.closePath();

ctx.fill();


/* Body */

ctx.fillStyle="#facc15";

ctx.beginPath();

ctx.arc(0,0,bird.r,0,Math.PI*2);

ctx.fill();


/* Wing */

ctx.fillStyle="#eab308";

ctx.beginPath();

ctx.ellipse(
-5,
5+bird.wing*4,
12,
6,
-.3,
0,
Math.PI*2
);

ctx.fill();


/* Eye */

ctx.fillStyle="white";

ctx.beginPath();

ctx.arc(7,-7,7,0,Math.PI*2);

ctx.fill();

ctx.fillStyle="#111";

ctx.beginPath();

ctx.arc(9,-7,3,0,Math.PI*2);

ctx.fill();


/* Beak */

ctx.fillStyle="#fb923c";

ctx.beginPath();

ctx.moveTo(15,-2);
ctx.lineTo(31,5);
ctx.lineTo(15,11);

ctx.closePath();

ctx.fill();

ctx.restore();

}



/* ---------------- DRAW PARTICLES ---------------- */

function drawParticles(){

for(const p of particles){

ctx.globalAlpha=Math.max(0,p.life/22);

ctx.fillStyle="#fef08a";

ctx.fillRect(
p.x,
p.y,
p.size,
p.size
);

}

ctx.globalAlpha=1;

}



/* ---------------- DRAW GROUND ---------------- */

function drawGround(){

const y=canvas.height-55;

ctx.fillStyle="#65a30d";

ctx.fillRect(
0,
y,
canvas.width,
55
);

ctx.fillStyle="#84cc16";

ctx.fillRect(
0,
y,
canvas.width,
10
);

ctx.fillStyle="#4d7c0f";

for(let x=0;x<canvas.width;x+=24){

ctx.fillRect(
x,
y+16,
10,
5
);

ctx.fillRect(
x+12,
y+34,
8,
5
);

}

}



/* ---------------- DRAW ---------------- */

function draw(){

ctx.clearRect(
0,
0,
canvas.width,
canvas.height
);

drawBackground();

drawPipes();

drawGround();

drawParticles();

drawBird();

}



/* ---------------- LOOP ---------------- */

function loop(time){

if(state!=="playing"){
draw();
return;
}

let dt=(time-lastTime)/16.67;

lastTime=time;

update(dt);

draw();

animationId=requestAnimationFrame(loop);

}



/* ---------------- FIRST SCREEN ---------------- */

resetBird();
makeBackground();
draw();

</script>

</body>
</html>
