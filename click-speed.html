<!doctype html>
<html>
<head>
<title>Click Speed - Malikhi Games</title>

<style>
body{
background:#111827;
color:white;
font-family:Arial;
text-align:center;
}

button{
font-size:30px;
padding:25px 50px;
border-radius:15px;
cursor:pointer;
border:0;
}

#click{
background:#22c55e;
color:white;
}

.box{
margin-top:40px;
}
</style>

</head>

<body>

<h1>🖱️ Click Speed</h1>

<div class="box">

<h2>Time: <span id="time">10</span>s</h2>

<h2>Clicks: <span id="score">0</span></h2>

<h2>CPS: <span id="cps">0</span></h2>

<button id="click">CLICK!</button>

<br><br>

<button onclick="start()">Start</button>

<h2 id="msg"></h2>

</div>


<script>

let clicks=0;
let time=10;
let running=false;
let timer;


const button=document.getElementById("click");


button.onclick=()=>{

if(running){

clicks++;

document.getElementById("score").innerHTML=clicks;

}

};



function start(){

clicks=0;
time=10;
running=true;


document.getElementById("score").innerHTML=0;
document.getElementById("time").innerHTML=10;
document.getElementById("cps").innerHTML=0;
document.getElementById("msg").innerHTML="";


clearInterval(timer);


timer=setInterval(()=>{

time--;

document.getElementById("time").innerHTML=time;


if(time<=0){

running=false;

clearInterval(timer);


let cps=(clicks/10).toFixed(1);


document.getElementById("cps").innerHTML=cps;

document.getElementById("msg").innerHTML=
"🔥 Finished! "+cps+" clicks per second";

}


},1000);

}

</script>

</body>
</html>
