<!doctype html><html><head><meta charset="utf-8"><title>Falling Blocks</title><style>body{margin:0;background:#222;text-align:center;color:#fff}canvas{background:#000}</style></head><body><h2>Falling Blocks</h2><canvas id=c width=500 height=500></canvas><script>const x=c.getContext('2d');let p={x:240,y:20},blocks=[];onkeydown=e=>{if(e.key==='ArrowLeft')p.x-=20;if(e.key==='ArrowRight')p.x+=20};setInterval(()=>{p.y+=5;if(p.y>480){blocks.push({x:p.x,y:480});p={x:Math.random()*480|0,y:0}};x.clearRect(0,0,500,500);x.fillStyle='#0ff';x.fillRect(p.x,p.y,20,20);x.fillStyle='#f55';blocks.forEach(b=>x.fillRect(b.x,b.y,20,20))},30)</script></body></html>
