<!DOCTYPE html>
<html>
<head>
<title>Word Guess - Malikhi Games</title>
<style>
body{
background:#101827;
color:white;
font-family:Arial;
text-align:center;
padding:30px
}
.box{
background:#1e293b;
padding:25px;
border-radius:20px;
max-width:500px;
margin:auto
}
input{
font-size:20px;
padding:10px;
border-radius:10px;
}
button{
padding:10px 20px;
border:0;
border-radius:10px;
cursor:pointer;
font-weight:bold;
}
#word{
font-size:40px;
letter-spacing:10px;
}
</style>
</head>

<body>

<div class="box">

<h1>🔤 Word Guess</h1>

<h2 id="word"></h2>

<p id="hint"></p>

<input id="guess" maxlength="1">

<button onclick="guess()">Guess</button>

<p>Wrong: <span id="wrong"></span></p>
<p>Lives: <span id="lives">6</span></p>
<p id="msg"></p>

<button onclick="start()">Restart</button>

</div>

<script>

let words=[
["football","sport"],
["minecraft","game"],
["dragon","animal"],
["pizza","food"],
["school","place"],
["computer","technology"],
["basketball","sport"],
["robot","machine"]
];

let answer="";
let display=[];
let wrong=[];
let lives=6;

function start(){

let pick=words[Math.floor(Math.random()*words.length)];

answer=pick[0];
display=Array(answer.length).fill("_");
wrong=[];
lives=6;

document.getElementById("hint").innerHTML="Hint: "+pick[1];

update();

}

function guess(){

let input=document.getElementById("guess");
let letter=input.value.toLowerCase();

input.value="";

if(!letter) return;

if(answer.includes(letter)){

for(let i=0;i<answer.length;i++){

if(answer[i]===letter){
display[i]=letter;
}

}

}else{

if(!wrong.includes(letter)){
wrong.push(letter);
lives--;
}

}

update();

if(!display.includes("_")){
document.getElementById("msg").innerHTML="🔥 You won!";
}

if(lives<=0){

document.getElementById("msg").innerHTML=
"💀 The word was "+answer;

}

}


function update(){

document.getElementById("word").innerHTML=display.join(" ");

document.getElementById("wrong").innerHTML=
wrong.join(", ");

document.getElementById("lives").innerHTML=lives;

}

start();

</script>

</body>
</html>
