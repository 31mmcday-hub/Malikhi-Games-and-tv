<!doctype html>
<html>
<head>
<title>Flappy Bird</title>

<style>
body{
background:#38bdf8;
color:white;
font-family:Arial;
text-align:center;
}

canvas{
background:#7dd3fc;
border:3px solid white;
display:block;
margin:auto;
}

button{
padding:10px 20px;
border-radius:10px;
font-weight:bold;
cursor:pointer;
}
</style>

</head>

<body>

<h1>🐦 Flappy Bird</h1>

<h2>Score: <span id="score">0</span></h2>

<canvas id="game" width="400" height="600"></canvas>

<button onclick="restart()">Restart</button>

<p>Space / Click = Fly</p>


<script>

const canvas=document.getElementById("game");
const ctx=canvas.getContext("2d");


let bird;
let pipes;
let score;
let gameOver;



document.addEventListener("keydown",e=>{

if(e.code==="Space"){
flap();
}

});


canvas.onclick=flap;



function restart(){

bird={
x:80,
y:300,
size:18,
velocity:0
};


pipes=[];

score=0;

gameOver=false;

document.getElementById("score").innerHTML=0;


spawnPipe();

requestAnimationFrame(update);

}



function flap(){

if(!gameOver){

bird.velocity=-7;

}

}




function spawnPipe(){

let gap=230;

let min=70;

let max=canvas.height-gap-70;


let topHeight=
Math.random()*(max-min)+min;


pipes.push({

x:400,

top:topHeight,

bottom:canvas.height-topHeight-gap,

passed:false

});

}



function update(){


if(gameOver)return;



// gravity

bird.velocity+=0.22;

bird.y+=bird.velocity;



// pipes

pipes.forEach(p=>{

p.x-=2;



if(
!p.passed &&
p.x+60<bird.x
){

score++;

p.passed=true;

document.getElementById("score").innerHTML=score;

}

});



// new pipes

if(
pipes.length===0 ||
pipes[pipes.length-1].x<220
){

spawnPipe();

}




// collision

pipes.forEach(p=>{


if(

bird.x+bird.size>p.x &&
bird.x-bird.size<p.x+60 &&

(
bird.y-bird.size<p.top ||
bird.y+bird.size>canvas.height-p.bottom

)

){

end();

}


});



// ground / sky

if(
bird.y>canvas.height ||
bird.y<0
){

end();

}



draw();

requestAnimationFrame(update);

}




function draw(){

ctx.clearRect(0,0,400,600);


// bird

ctx.fillStyle="yellow";

ctx.beginPath();

ctx.arc(
bird.x,
bird.y,
bird.size,
0,
Math.PI*2
);

ctx.fill();



// pipes

ctx.fillStyle="green";


pipes.forEach(p=>{


ctx.fillRect(
p.x,
0,
60,
p.top
);


ctx.fillRect(
p.x,
canvas.height-p.bottom,
60,
p.bottom
);


});


}



function end(){

gameOver=true;

setTimeout(()=>{

alert("Game Over! Score: "+score);

},100);

}



restart();

</script>

</body>
</html>
