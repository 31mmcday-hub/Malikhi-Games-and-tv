<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Stopwatch Challenge - Malikhi Games</title>

<style>
*{
  box-sizing:border-box;
}

body{
  margin:0;
  min-height:100vh;
  background:linear-gradient(135deg,#111827,#1e1b4b);
  color:white;
  font-family:Arial,sans-serif;
  text-align:center;
}

h1{
  margin:25px 0 5px;
  font-size:36px;
}

.subtitle{
  opacity:.75;
  margin-bottom:20px;
}

#game{
  width:min(600px,94vw);
  margin:auto;
  padding:25px;
  background:rgba(255,255,255,.08);
  border:2px solid rgba(255,255,255,.15);
  border-radius:22px;
  box-shadow:0 20px 50px rgba(0,0,0,.4);
}

#round{
  font-size:20px;
  font-weight:bold;
  margin-bottom:15px;
}

#time{
  font-size:58px;
  font-weight:bold;
  margin:20px 0;
  font-family:monospace;
}

.bar{
  position:relative;
  width:100%;
  height:55px;
  background:#374151;
  border-radius:15px;
  overflow:hidden;
  margin:25px 0;
}

.green{
  position:absolute;
  top:0;
  bottom:0;
  background:#22c55e;
  box-shadow:0 0 20px #22c55e;
}

.marker{
  position:absolute;
  top:0;
  bottom:0;
  width:5px;
  background:white;
  box-shadow:0 0 10px white;
  left:0;
}

button{
  border:0;
  padding:14px 25px;
  margin:6px;
  border-radius:13px;
  font-size:18px;
  font-weight:bold;
  cursor:pointer;
}

button:hover{
  transform:scale(1.05);
}

#start{
  background:#facc15;
  color:#111;
}

#stop{
  background:#ef4444;
  color:white;
}

#message{
  min-height:35px;
  margin:15px 0;
  font-size:21px;
  font-weight:bold;
}

#stats{
  display:flex;
  justify-content:center;
  gap:12px;
  flex-wrap:wrap;
  margin-top:20px;
}

.stat{
  background:#1f2937;
  padding:10px 15px;
  border-radius:12px;
  font-weight:bold;
}

.good{
  color:#4ade80;
}

.bad{
  color:#f87171;
}

.hidden{
  display:none;
}
</style>
</head>

<body>

<h1>⏱️ STOPWATCH CHALLENGE</h1>

<p class="subtitle">
Stop the timer when the marker is inside the 🟢 GREEN zone!
</p>

<div id="game">

  <div id="round">
    Round: <span id="roundNum">0</span>
  </div>

  <div id="time">
    0.000
  </div>

  <div class="bar">

    <div id="green" class="green"></div>

    <div id="marker" class="marker"></div>

  </div>

  <button id="start" onclick="startGame()">
    ▶️ START
  </button>

  <button id="stop" onclick="stopGame()" disabled>
    🛑 STOP
  </button>

  <div id="message">
    Start when you're ready 👀
  </div>

  <div id="stats">

    <div class="stat">
      🔥 Streak:
      <span id="streak">0</span>
    </div>

    <div class="stat">
      ⭐ Score:
      <span id="score">0</span>
    </div>

    <div class="stat">
      🏆 Best:
      <span id="best">0</span>
    </div>

    <div class="stat">
      🎯 Zone:
      <span id="zoneSize">20%</span>
    </div>

  </div>

</div>

<script>

let running=false;

let startTime=0;

let animation;

let round=0;

let score=0;

let streak=0;

let best=Number(
  localStorage.getItem("malikhiStopwatchBest") || 0
);

let greenStart=40;

let greenWidth=20;

let direction=1;

let markerPosition=0;

let speed=0.55;

document.getElementById("best").textContent=best;


/* =========================
   START GAME
========================= */

function startGame(){

  if(running)return;

  running=true;

  startTime=performance.now();

  document.getElementById("start").disabled=true;

  document.getElementById("stop").disabled=false;

  document.getElementById("message").textContent=
    "STOP IT IN THE GREEN! 🟢";

  document.getElementById("message").className="";

  markerPosition=0;

  animation=requestAnimationFrame(update);

}



/* =========================
   TIMER UPDATE
========================= */

function update(now){

  if(!running)return;

  let elapsed=
    (now-startTime)/1000;

  document.getElementById("time").textContent=
    elapsed.toFixed(3);


  /*
    Move marker back and forth.
    It gets faster as you progress.
  */

  markerPosition+=
    direction*speed;


  if(markerPosition>=100){

    markerPosition=100;

    direction=-1;

  }

  if(markerPosition<=0){

    markerPosition=0;

    direction=1;

  }


  document.getElementById("marker").style.left=
    "calc("+markerPosition+"% - 2px)";


  animation=
    requestAnimationFrame(update);

}



/* =========================
   STOP
========================= */

function stopGame(){

  if(!running)return;

  running=false;

  cancelAnimationFrame(animation);

  document.getElementById("start").disabled=false;

  document.getElementById("stop").disabled=true;


  let inside=
    markerPosition>=greenStart &&
    markerPosition<=greenStart+greenWidth;


  if(inside){

    success();

  }
  else{

    fail();

  }

}



/* =========================
   SUCCESS
========================= */

function success(){

  round++;

  score++;

  streak++;


  if(streak>best){

    best=streak;

    localStorage.setItem(
      "malikhiStopwatchBest",
      best
    );

  }


  document.getElementById("roundNum").textContent=
    round;

  document.getElementById("score").textContent=
    score;

  document.getElementById("streak").textContent=
    streak;

  document.getElementById("best").textContent=
    best;


  document.getElementById("message").textContent=
    "🔥 PERFECT! You're cooking!";

  document.getElementById("message").className=
    "good";


  /*
    MAKE IT HARDER
  */

  greenWidth=
    Math.max(
      5,
      greenWidth-2
    );


  speed=
    Math.min(
      1.8,
      speed+0.12
    );


  /*
    Move the green zone
    to a random position.
  */

  greenStart=
    Math.random()*(100-greenWidth);


  updateGreen();


  document.getElementById("zoneSize").textContent=
    greenWidth.toFixed(0)+"%";

}



/* =========================
   FAIL
========================= */

function fail(){

  streak=0;

  document.getElementById("streak").textContent=
    0;


  document.getElementById("message").textContent=
    "💀 MISSED! You gotta hit the green!";


  document.getElementById("message").className=
    "bad";


  /*
    Reset difficulty a little,
    but don't make it completely easy.
  */

  greenWidth=
    Math.min(
      20,
      greenWidth+1
    );


  speed=
    Math.max(
      0.55,
      speed-0.05
    );


  updateGreen();


  document.getElementById("zoneSize").textContent=
    greenWidth.toFixed(0)+"%";

}



/* =========================
   GREEN ZONE
========================= */

function updateGreen(){

  const green=
    document.getElementById("green");

  green.style.left=
    greenStart+"%";

  green.style.width=
    greenWidth+"%";

}



/* =========================
   KEYBOARD
========================= */

document.addEventListener("keydown",e=>{

  if(e.code==="Space"){

    e.preventDefault();

    if(!running){

      startGame();

    }
    else{

      stopGame();

    }

  }

});



/* =========================
   INITIAL
========================= */

updateGreen();

</script>

</body>
</html>
