<!doctype html><html><head><meta charset="utf-8"><title>Minesweeper</title><style>body{background:#222;color:#fff;text-align:center}.g{width:400px;margin:auto;display:grid;grid-template-columns:repeat(10,1fr)}button{height:40px;font-size:18px}</style></head><body><h2>Minesweeper</h2><div class=g id=g></div><script>let m=Array(100).fill(0),open=Array(100).fill(0);for(let i=0;i<15;i++)m[Math.random()*100|0]=9;function count(i){let x=i%10,y=i/10|0,n=0;for(let dy=-1;dy<2;dy++)for(let dx=-1;dx<2;dx++){let X=x+dx,Y=y+dy;if(X>=0&&X<10&&Y>=0&&Y<10&&m[Y*10+X]===9)n++}return n}for(let i=0;i<100;i++){let b=document.createElement('button');b.textContent='?';b.onclick=()=>{open[i]=1;b.textContent=m[i]===9?'💣':count(i)||'';if(m[i]===9)alert('Boom!');};g.appendChild(b)}</script></body></html>
