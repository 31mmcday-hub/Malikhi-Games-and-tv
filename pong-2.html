<!DOCTYPE html>
<html>
<head>
<title>Pong 2 - Malikhi Games</title>
<style>
body{
background:#101827;
color:white;
font-family:Arial;
text-align:center;
}
canvas{
background:#000;
border:3px solid white;
margin-top:20px;
}
button{
padding:10px 20px;
border-radius:10px;
border:0;
font-weight:bold;
}
</style>
</head>

<body>

<h1>🏓 Pong 2</h1>

<p>
Player: <span id="p">0</span>
-
AI: <span id="a">0</span>
</p>

<canvas id="game" width="700" height="400"></canvas>

<br>
<button onclick="start()">Start</button>

<script>

const canvas=document.getElementById("game");
const ctx=canvas.getContext("2d");

let player,ai,ball,pScore,aScore,running=false;

document.addEventListener("mousemove",e=>{
let rect=canvas.getBoundingClientRect();
player.y=e.clientY-rect.top-50;
});


function start(){

player={x:20,y:150,w:15,h:100};
ai={x:665,y:150,w:15,h:100};

ball={
x:350,
y:200,
r:10,
dx:5,
dy:3
};

pScore=0;
aScore=0;

document.getElementById("p").innerHTML=0;
document.getElementById("a").innerHTML=0;

running=true;

loop();

}


function loop(){

if(!running)return;


ball.x+=ball.dx;
ball.y+=ball.dy;


// walls

if(ball.y<0||ball.y>400){
ball.dy*=-1;
}


// AI

if(ai.y+50<ball.y)
ai.y+=3;

if(ai.y+50>ball.y)
ai.y-=3;


// paddle hit

if(
ball.x-ball.r<player.x+player.w &&
ball.y>player.y &&
ball.y<player.y+player.h
){
ball.dx*=-1;
}


if(
ball.x+ball.r>ai.x &&
ball.y>ai.y &&
ball.y<ai.y+ai.h
){
ball.dx*=-1;
}


// scoring

if(ball.x<0){

aScore++;
reset();

}

if(ball.x>700){

pScore++;
reset();

}


document.getElementById("p").innerHTML=pScore;
document.getElementById("a").innerHTML=aScore;


draw();

requestAnimationFrame(loop);

}



function reset(){

ball.x=350;
ball.y=200;
ball.dx*=-1;

}



function draw(){

ctx.clearRect(0,0,700,400);


// paddles

ctx.fillStyle="white";

ctx.fillRect(
player.x,
player.y,
player.w,
player.h
);


ctx.fillRect(
ai.x,
ai.y,
ai.w,
ai.h
);


// ball

ctx.beginPath();

ctx.arc(
ball.x,
ball.y,
ball.r,
0,
Math.PI*2
);

ctx.fill();


}

</script>

</body>
</html>
