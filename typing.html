<!doctype html><html><head><meta charset="utf-8"><title>Typing Race</title><style>body{background:#111;color:#fff;text-align:center;font:22px Arial}input{font-size:22px;width:80%;padding:10px}</style></head><body><h2>Typing Race</h2><p id=w>The quick brown fox jumps over the lazy dog.</p><input id=i autofocus><p id=s>Type it!</p><script>let t; i.oninput=()=>{if(!t)t=performance.now();if(i.value===w.textContent){s.textContent='Finished in '+((performance.now()-t)/1000).toFixed(2)+' seconds 🔥';i.disabled=true}}</script></body></html>
