<!doctype html><html><head><meta charset="utf-8"><title>2048</title><style>body{background:#222;color:#fff;text-align:center;font:20px Arial}.g{width:420px;margin:auto;display:grid;grid-template-columns:repeat(4,1fr);gap:8px;background:#555;padding:8px}.t{height:90px;background:#777;display:grid;place-items:center;font-size:30px}</style></head><body><h2>2048</h2><div class=g id=g></div><script>let a=Array(16).fill(0);function add(){let z=a.map((v,i)=>v?null:i).filter(v=>v!==null);if(z.length)a[z[Math.random()*z.length|0]]=Math.random()<.9?2:4}function draw(){g.innerHTML=a.map(v=>'<div class=t>'+ (v||'')+'</div>').join('')}function move(d){let rows=[];for(let r=0;r<4;r++){let q=[];for(let c=0;c<4;c++)q.push(a[r*4+c]);if(d==='L'||d==='R'){if(d==='R')q.reverse();q=q.filter(Boolean);for(let i=0;i<q.length-1;i++)if(q[i]===q[i+1]){q[i]*=2;q.splice(i+1,1)}while(q.length<4)q.push(0);if(d==='R')q.reverse();for(let c=0;c<4;c++)a[r*4+c]=q[c]}}add();draw()}onkeydown=e=>{if(['ArrowLeft','ArrowRight'].includes(e.key))move(e.key==='ArrowLeft'?'L':'R')};add();add();draw()</script></body></html>
