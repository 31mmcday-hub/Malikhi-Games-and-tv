<!doctype html><html><head><meta charset="utf-8"><title>Sokoban</title><style>body{background:#111;color:#fff;text-align:center;font:24px monospace}pre{font-size:30px}</style></head><body><h2>Sokoban</h2><pre id=p></pre><script>let a=['########','#  .   #','#  $   #','#  @   #','#   .  #','########'];let px=3,py=3;function draw(){p.textContent=a.map(r=>r).join('\n')}onkeydown=e=>{let d={ArrowUp:[0,-1],ArrowDown:[0,1],ArrowLeft:[-1,0],ArrowRight:[1,0]}[e.key];if(!d)return;let nx=px+d[0],ny=py+d[1],row=a[ny];if(row[nx]==='#')return;if(row[nx]==='$'){let bx=nx+d[0],by=ny+d[1];if(a[by][bx]!==' ')return;a[by]=a[by].slice(0,bx)+'$'+a[by].slice(bx+1);a[ny]=a[ny].slice(0,nx)+' '+a[ny].slice(nx+1)}px=nx;py=ny;a[py]=a[py].slice(0,px)+'@'+a[py].slice(px+1);draw()}draw()</script></body></html>
