<!doctype html><html><head><meta charset="utf-8"><title>Brick Breaker</title><style>body{margin:0;background:#111;text-align:center}canvas{background:#000}</style></head><body><canvas id=c width=600 height=500></canvas><script>const x=c.getContext('2d');let p=260,b={x:300,y:430,vx:4,vy:-4},br=[];for(let r=0;r<4;r++)for(let i=0;i<10;i++)br.push({x:i*60,y:r*25,on:1});let k={};onkeydown=e=>k[e.key]=1;onkeyup=e=>k[e.key]=0;setInterval(()=>{if(k.ArrowLeft)p-=7;if(k.ArrowRight)p+=7;b.x+=b.vx;b.y+=b.vy;if(b.x<5||b.x>595)b.vx*=-1;if(b.y<5)b.vy*=-1;if(b.y>480){b={x:300,y:430,vx:4,vy:-4}}if(b.y>440&&b.x>p&&b.x<p+80)b.vy=-Math.abs(b.vy);br.forEach(q=>{if(q.on&&b.x>q.x&&b.x<q.x+58&&b.y>q.y&&b.y<q.y+23){q.on=0;b.vy*=-1}});x.clearRect(0,0,600,500);x.fillStyle='#fff';x.fillRect(p,450,80,12);x.beginPath();x.arc(b.x,b.y,7,0,7);x.fill();br.forEach(q=>{if(q.on){x.fillStyle='#f55';x.fillRect(q.x,q.y,58,23)}})},16)</script></body></html>
