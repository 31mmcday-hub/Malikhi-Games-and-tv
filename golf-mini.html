<!doctype html>
<html>
<head>
<title>Mini Golf</title>

<style>
body{
background:#14532d;
color:white;
text-align:center;
font-family:Arial;
}

canvas{
background:#22c55e;
border:3px solid white;
display:block;
margin:auto;
}
</style>

</head>

<body>

<h1>⛳ Mini Golf</h1>

<h2>Strokes: <span id="score">0</span></h2>

<p>
🖱️ Mouse: Drag and release<br>
⌨️ Keyboard: Arrows aim | Hold Space then release to shoot
</p>

<canvas id="game" width="600" height="400"></canvas>

<h2 id="msg"></h2>


<script>

const canvas=document.getElementById("game");
const ctx=canvas.getContext("2d");


let ball={
x:100,
y:200,
r:10,
vx:0,
vy:0
};


let hole={
x:520,
y:200,
r:15
};


let aimX=1;
let aimY=0;
let power=0;


let charging=false;


let keys={};


let strokes=0;



let walls=[

{x:250,y:0,w:20,h:150},

{x:250,y:250,w:20,h:150},

{x:400,y:100,w:20,h:200}

];



// keyboard

document.addEventListener("keydown",e=>{

keys[e.key]=true;


if(e.code==="Space"){
charging=true;
}

});


document.addEventListener("keyup",e=>{

keys[e.key]=false;


if(e.code==="Space" && charging){

shoot(power);

power=0;

charging=false;

}

});




// mouse

let dragging=false;
let startX;
let startY;


canvas.onmousedown=e=>{

dragging=true;

startX=e.offsetX;
startY=e.offsetY;

};


canvas.onmouseup=e=>{

if(!dragging)return;


let dx=startX-e.offsetX;
let dy=startY-e.offsetY;


shoot(Math.min(Math.hypot(dx,dy)/4,20),dx,dy);


dragging=false;

};





function shoot(p,dx=aimX,dy=aimY){

if(ball.vx!==0||ball.vy!==0)return;


let len=Math.hypot(dx,dy);

if(len===0)return;


ball.vx=(dx/len)*p;
ball.vy=(dy/len)*p;


strokes++;

document.getElementById("score").innerHTML=strokes;

}





function update(){


// keyboard aim

if(keys["ArrowLeft"]) aimX=-1;

if(keys["ArrowRight"]) aimX=1;

if(keys["ArrowUp"]) aimY=-1;

if(keys["ArrowDown"]) aimY=1;



if(charging){

power+=0.2;

if(power>20)
power=20;

}




ball.x+=ball.vx;
ball.y+=ball.vy;



ball.vx*=0.98;
ball.vy*=0.98;



walls.forEach(w=>{

if(
ball.x+ball.r>w.x &&
ball.x-ball.r<w.x+w.w &&
ball.y+ball.r>w.y &&
ball.y-ball.r<w.y+w.h
){

ball.vx*=-1;
ball.vy*=-1;

}

});



if(ball.x<10||ball.x>590)
ball.vx*=-1;


if(ball.y<10||ball.y>390)
ball.vy*=-1;




let distance=Math.hypot(
ball.x-hole.x,
ball.y-hole.y
);



if(distance<hole.r){

document.getElementById("msg").innerHTML=
"🏆 You Win in "+strokes+" strokes!";

ball.vx=0;
ball.vy=0;

}



draw();

requestAnimationFrame(update);

}




function draw(){

ctx.clearRect(0,0,600,400);


// hole

ctx.fillStyle="black";

ctx.beginPath();

ctx.arc(
hole.x,
hole.y,
hole.r,
0,
Math.PI*2
);

ctx.fill();



// walls

ctx.fillStyle="#166534";

walls.forEach(w=>{

ctx.fillRect(
w.x,
w.y,
w.w,
w.h
);

});



// ball

ctx.fillStyle="white";

ctx.beginPath();

ctx.arc(
ball.x,
ball.y,
ball.r,
0,
Math.PI*2
);

ctx.fill();


// power bar

ctx.fillStyle="yellow";

ctx.fillRect(
20,
370,
power*5,
10
);


}



update();

</script>

</body>
</html>
