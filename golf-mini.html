<!doctype html>
<html>
<head>
<title>Mini Golf</title>

<style>
body{
background:#14532d;
color:white;
text-align:center;
font-family:Arial;
}

canvas{
background:#22c55e;
border:4px solid white;
display:block;
margin:auto;
}

button{
padding:10px 20px;
margin:8px;
border-radius:10px;
font-weight:bold;
}
</style>

</head>

<body>

<h1>⛳ Mini Golf</h1>

<h2>
Hole: <span id="holeNum">1</span>
|
Strokes: <span id="strokes">0</span>
</h2>

<canvas id="game" width="700" height="450"></canvas>

<br>

<button onclick="nextHole()">Next Hole</button>

<p>
🖱️ Drag and release to shoot<br>
⌨️ Arrow keys aim | Space shoots
</p>


<script>

const canvas=document.getElementById("game");
const ctx=canvas.getContext("2d");


let holeNumber=0;
let strokes=0;

let angle=0;
let power=0;

let charging=false;


let ball={
x:100,
y:350,
vx:0,
vy:0,
r:10
};


let maps=[

{
hole:{x:600,y:80},
sand:[
{x:300,y:200,w:100,h:70}
],
water:[
{x:450,y:300,w:120,h:80}
]
},


{
hole:{x:100,y:80},
sand:[
{x:250,y:100,w:120,h:80},
{x:500,y:250,w:80,h:70}
],
water:[
{x:350,y:350,w:150,h:50}
]
},


{
hole:{x:600,y:350},
sand:[
{x:200,y:250,w:100,h:100}
],
water:[
{x:300,y:0,w:100,h:150}
]
},


{
hole:{x:350,y:60},
sand:[
{x:100,y:150,w:120,h:80},
{x:500,y:150,w:120,h:80}
],
water:[
{x:250,y:300,w:200,h:60}
]
},


{
hole:{x:80,y:350},
sand:[
{x:400,y:100,w:120,h:100}
],
water:[
{x:150,y:0,w:100,h:200}
]
}

];



let map;



function loadMap(){

map=maps[holeNumber];

ball.x=100;
ball.y=350;

ball.vx=0;
ball.vy=0;

document.getElementById("holeNum").innerHTML=
holeNumber+1;

}



function nextHole(){

holeNumber++;

if(holeNumber>=maps.length){

alert("🏆 You beat all holes!");

holeNumber=0;
strokes=0;

}

loadMap();

}



document.addEventListener("keydown",e=>{

if(e.key==="ArrowLeft")
angle-=0.1;

if(e.key==="ArrowRight")
angle+=0.1;

if(e.code==="Space")
charging=true;

});


document.addEventListener("keyup",e=>{

if(e.code==="Space"){

shoot(power);

power=0;

charging=false;

}

});



canvas.onmousedown=e=>{

charging=true;

};


canvas.onmouseup=e=>{

shoot(power);

power=0;

charging=false;

};



function shoot(p){

if(ball.vx||ball.vy)return;

ball.vx=Math.cos(angle)*p;
ball.vy=Math.sin(angle)*p;

strokes++;

document.getElementById("strokes").innerHTML=strokes;

}




function update(){


if(charging){

power+=0.15;

if(power>12)
power=12;

}



ball.x+=ball.vx;
ball.y+=ball.vy;


ball.vx*=0.98;
ball.vy*=0.98;



// walls

if(ball.x<10||ball.x>690)
ball.vx*=-1;

if(ball.y<10||ball.y>440)
ball.vy*=-1;



// sand

map.sand.forEach(s=>{

if(
ball.x>s.x &&
ball.x<s.x+s.w &&
ball.y>s.y &&
ball.y<s.y+s.h
){

ball.vx*=0.96;
ball.vy*=0.96;

}

});


// water

map.water.forEach(w=>{

if(
ball.x>w.x &&
ball.x<w.x+w.w &&
ball.y>w.y &&
ball.y<w.y+w.h
){

ball.x=100;
ball.y=350;

ball.vx=0;
ball.vy=0;

}

});



// win

let d=Math.hypot(
ball.x-map.hole.x,
ball.y-map.hole.y
);


if(d<15){

alert("⛳ Hole Complete!");

nextHole();

}


draw();

requestAnimationFrame(update);

}



function draw(){

ctx.clearRect(0,0,700,450);


// sand

ctx.fillStyle="#d6b656";

map.sand.forEach(s=>{
ctx.fillRect(s.x,s.y,s.w,s.h);
});


// water

ctx.fillStyle="#2563eb";

map.water.forEach(w=>{
ctx.fillRect(w.x,w.y,w.w,w.h);
});


// hole

ctx.fillStyle="black";

ctx.beginPath();

ctx.arc(
map.hole.x,
map.hole.y,
15,
0,
Math.PI*2
);

ctx.fill();


// flag

ctx.fillStyle="white";

ctx.fillRect(
map.hole.x,
map.hole.y-50,
3,
50
);


// ball

ctx.fillStyle="white";

ctx.beginPath();

ctx.arc(
ball.x,
ball.y,
ball.r,
0,
Math.PI*2
);

ctx.fill();


// power bar

ctx.fillStyle="yellow";

ctx.fillRect(
20,
420,
power*10,
10
);


}


loadMap();
update();

</script>

</body>
</html>
