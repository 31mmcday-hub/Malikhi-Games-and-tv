<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>Pong</title>

<style>
body{
margin:0;
background:#000;
color:white;
text-align:center;
font-family:Arial;
}

canvas{
display:block;
margin:auto;
border:2px solid white;
}

button{
padding:8px 15px;
margin:5px;
border-radius:8px;
cursor:pointer;
font-weight:bold;
}

#score{
font-size:28px;
}
</style>

</head>

<body>

<h2>🏓 Pong</h2>

<div>
Speed:
<button onclick="setSpeed(3)">🐢 Slow</button>
<button onclick="setSpeed(5)">⚡ Normal</button>
<button onclick="setSpeed(7)">🔥 Fast</button>
<button onclick="setSpeed(10)">💀 Insane</button>
</div>

<div id="score">
Player 0 - 0 AI
</div>

<canvas id="c" width="700" height="450"></canvas>

<h3 id="message"></h3>


<script>

const canvas=document.getElementById("c");
const x=canvas.getContext("2d");


let py=180;
let ay=180;

let up=false;
let down=false;

let playerScore=0;
let aiScore=0;

let speed=5;


let b={
x:350,
y:225,
vx:speed,
vy:3
};


function setSpeed(s){

speed=s;

b.vx=b.vx>0 ? speed : -speed;

}


// controls

onkeydown=e=>{

if(e.key==="ArrowUp")
up=true;

if(e.key==="ArrowDown")
down=true;

};


onkeyup=e=>{

if(e.key==="ArrowUp")
up=false;

if(e.key==="ArrowDown")
down=false;

};



function resetBall(){

b={
x:350,
y:225,
vx:b.vx>0?speed:-speed,
vy:3
};

}



function update(){


// player

if(up)
py-=8;

if(down)
py+=8;


if(py<0)
py=0;

if(py>360)
py=360;



// ball

b.x+=b.vx;
b.y+=b.vy;


// walls

if(b.y<0 || b.y>450)
b.vy*=-1;



// player hit

if(
b.x<35 &&
b.y>py &&
b.y<py+90
){

b.vx=Math.abs(b.vx);

}



// AI

ay+=(b.y-ay-45)*.08;



// AI hit

if(
b.x>665 &&
b.y>ay &&
b.y<ay+90
){

b.vx=-Math.abs(b.vx);

}



// score

if(b.x<0){

aiScore++;
resetBall();

}


if(b.x>700){

playerScore++;
resetBall();

}


// win

if(playerScore>=10){

document.getElementById("message").innerHTML=
"🔥 You Win!";

return;

}


if(aiScore>=10){

document.getElementById("message").innerHTML=
"💀 AI Wins!";

return;

}



draw();

requestAnimationFrame(update);

}



function draw(){

x.clearRect(0,0,700,450);

x.fillStyle="white";


x.fillRect(20,py,15,90);

x.fillRect(665,ay,15,90);


x.fillRect(
b.x-7,
b.y-7,
14,
14
);


document.getElementById("score").innerHTML=
"Player "+playerScore+" - "+aiScore+" AI";

}


update();


</script>

</body>
</html>
