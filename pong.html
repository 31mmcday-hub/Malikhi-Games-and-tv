<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>Pong</title>

<style>
body{
  margin:0;
  background:#000;
  text-align:center;
  color:#fff;
  font-family:Arial;
}

canvas{
  display:block;
  margin:auto;
}
</style>

</head>

<body>

<h2>Pong — Arrow Keys</h2>

<canvas id="c" width="700" height="450"></canvas>

<script>

const canvas = document.getElementById("c");
const x = canvas.getContext("2d");

let py = 180;
let ay = 180;

let up = false;
let down = false;

let b = {
  x:350,
  y:225,
  vx:5,
  vy:3
};


// Arrow controls

onkeydown = e => {

  if(e.key === "ArrowUp"){
    up = true;
  }

  if(e.key === "ArrowDown"){
    down = true;
  }

};


onkeyup = e => {

  if(e.key === "ArrowUp"){
    up = false;
  }

  if(e.key === "ArrowDown"){
    down = false;
  }

};


setInterval(()=>{


// player movement

if(up){
  py -= 8;
}

if(down){
  py += 8;
}


// keep player on screen

if(py < 0){
  py = 0;
}

if(py > 360){
  py = 360;
}


// ball

b.x += b.vx;
b.y += b.vy;


// top/bottom bounce

if(b.y < 0 || b.y > 450){
  b.vy *= -1;
}


// paddle hits

if(
  b.x < 35 &&
  b.y > py &&
  b.y < py+90
){
  b.vx = Math.abs(b.vx);
}


if(
  b.x > 665 &&
  b.y > ay &&
  b.y < ay+90
){
  b.vx = -Math.abs(b.vx);
}


// AI

ay += (b.y-ay-45)*.08;


// reset ball

if(b.x < 0 || b.x > 700){

  b = {
    x:350,
    y:225,
    vx:b.x < 0 ? 5 : -5,
    vy:3
  };

}


// draw

x.clearRect(0,0,700,450);

x.fillStyle="#fff";

x.fillRect(20,py,15,90);

x.fillRect(665,ay,15,90);

x.fillRect(
  b.x-7,
  b.y-7,
  14,
  14
);


},16);

</script>

</body>
</html>
