<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>Pong</title>

<style>
body{
margin:0;
background:#000;
color:white;
text-align:center;
font-family:Arial;
}

canvas{
display:block;
margin:auto;
border:2px solid white;
}

button{
padding:8px 12px;
margin:4px;
border-radius:8px;
cursor:pointer;
font-weight:bold;
}

#score{
font-size:30px;
}

#msg{
font-size:25px;
}
</style>

</head>

<body>

<h2>🏓 Pong</h2>

<div>
Difficulty:
<button onclick="setDifficulty('easy')">🟢 Easy</button>
<button onclick="setDifficulty('medium')">🟡 Medium</button>
<button onclick="setDifficulty('hard')">🔴 Hard</button>
</div>

<div>
Speed:
<button onclick="setSpeed(8)">🐢 Slow</button>
<button onclick="setSpeed(15)">⚡ Normal</button>
<button onclick="setSpeed(25)">🔥 Fast</button>
<button onclick="setSpeed(45)">💀 Insane</button>
</div>

<p id="score">Player 0 - 0 AI</p>

<canvas id="c" width="700" height="450"></canvas>

<p id="msg"></p>


<script>

const canvas=document.getElementById("c");
const x=canvas.getContext("2d");


let py=180;
let ay=180;


let up=false;
let down=false;


let playerScore=0;
let aiScore=0;


let speed=15;
let difficulty="medium";


let aiPower=.08;


let b={
x:350,
y:225,
vx:speed,
vy:5
};



function setDifficulty(level){

difficulty=level;

if(level==="easy"){
aiPower=.03;
}

if(level==="medium"){
aiPower=.08;
}

if(level==="hard"){
aiPower=.18;
}

}



function setSpeed(amount){

speed=amount;

b.vx=b.vx>0 ? speed : -speed;

b.vy=speed*.35;

}



onkeydown=e=>{

if(e.key==="ArrowUp")
up=true;

if(e.key==="ArrowDown")
down=true;

};



onkeyup=e=>{

if(e.key==="ArrowUp")
up=false;

if(e.key==="ArrowDown")
down=false;

};



function resetBall(){

b={
x:350,
y:225,
vx:b.vx>0 ? speed : -speed,
vy:speed*.35
};

}



function update(){


if(up)
py-=10;


if(down)
py+=10;


if(py<0)
py=0;


if(py>360)
py=360;



b.x+=b.vx;
b.y+=b.vy;



if(b.y<0 || b.y>450){

b.vy*=-1;

}



// player hit

if(
b.x<35 &&
b.y>py &&
b.y<py+90
){

b.vx=Math.abs(b.vx);

}



// AI

ay += (b.y-ay-45)*aiPower;



if(
b.x>665 &&
b.y>ay &&
b.y<ay+90
){

b.vx=-Math.abs(b.vx);

}



// scoring

if(b.x<0){

aiScore++;
resetBall();

}


if(b.x>700){

playerScore++;
resetBall();

}



// win

if(playerScore>=10){

document.getElementById("msg").innerHTML="🔥 YOU WIN";

return;

}


if(aiScore>=10){

document.getElementById("msg").innerHTML="💀 AI WINS";

return;

}


draw();

requestAnimationFrame(update);

}




function draw(){

x.clearRect(0,0,700,450);


x.fillStyle="white";


x.fillRect(20,py,15,90);

x.fillRect(665,ay,15,90);


x.fillRect(
b.x-7,
b.y-7,
14,
14
);


document.getElementById("score").innerHTML=
"Player "+playerScore+" - "+aiScore+" AI";

}



update();

</script>

</body>
</html>
