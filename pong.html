<!doctype html><html><head><meta charset="utf-8"><title>Pong</title><style>body{margin:0;background:#000;text-align:center;color:#fff}canvas{display:block;margin:auto}</style></head><body><h2>Pong — W/S</h2><canvas id=c width=700 height=450></canvas><script>const x=c.getContext('2d');let py=180,ay=180,b={x:350,y:225,vx:5,vy:3};onkeydown=e=>{if(e.key==='w')py-=10;if(e.key==='s')py+=10};setInterval(()=>{b.x+=b.vx;b.y+=b.vy;if(b.y<0||b.y>450)b.vy*=-1;if(b.x<35&&b.y>py&&b.y<py+90)b.vx=Math.abs(b.vx);if(b.x>665&&b.y>ay&&b.y<ay+90)b.vx=-Math.abs(b.vx);ay+=(b.y-ay-45)*.08;if(b.x<0||b.x>700)b={x:350,y:225,vx:b.x<0?5:-5,vy:3};x.clearRect(0,0,700,450);x.fillStyle='#fff';x.fillRect(20,py,15,90);x.fillRect(665,ay,15,90);x.fillRect(b.x-7,b.y-7,14,14)},16)</script></body></html>
