<!doctype html><html><head><meta charset="utf-8"><title>Neon Runner</title><style>body{margin:0;background:#080018;color:#fff;text-align:center}canvas{background:#090022}</style></head><body><h2>Neon Runner</h2><canvas id=c width=700 height=400></canvas><script>const x=c.getContext('2d');let p={x:80,y:330,vy:0},obs=[];onkeydown=e=>{if(e.key===' '&&p.y>=330)p.vy=-12};setInterval(()=>{p.vy+=.6;p.y+=p.vy;if(Math.random()<.04)obs.push({x:700,h:30+Math.random()*60});obs.forEach(o=>o.x-=6);x.clearRect(0,0,700,400);x.fillStyle='#0ff';x.fillRect(p.x,p.y,30,30);x.fillStyle='#f0f';obs.forEach(o=>{x.fillRect(o.x,370-o.h,25,o.h);if(o.x<110&&o.x>60&&p.y+30>370-o.h)location.reload()});x.fillStyle='#fff';x.fillText('SPACE = jump',10,20)},30)</script></body></html>
