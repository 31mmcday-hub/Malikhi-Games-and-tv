<!doctype html>
<html>
<head>
<title>Doodle Jump</title>

<style>
body{
margin:0;
background:#111827;
color:white;
text-align:center;
font-family:Arial;
}

canvas{
background:#87ceeb;
display:block;
margin:auto;
border:3px solid white;
}

button{
padding:10px 20px;
border-radius:10px;
border:0;
font-weight:bold;
}
</style>

</head>

<body>

<h1>🦘 Doodle Jump</h1>

<p>⬅️ ➡️ Move</p>

<h2>Score: <span id="score">0</span></h2>

<canvas id="game" width="400" height="600"></canvas>

<button onclick="restart()">Restart</button>


<script>

const canvas=document.getElementById("game");
const ctx=canvas.getContext("2d");

let player;
let platforms=[];
let keys={};
let score=0;


document.addEventListener("keydown",e=>{
keys[e.key]=true;
});


document.addEventListener("keyup",e=>{
keys[e.key]=false;
});


function restart(){

player={
x:180,
y:450,
w:30,
h:30,
dy:0
};

platforms=[];

for(let i=0;i<10;i++){

platforms.push({
x:Math.random()*330,
y:550-i*70,
w:70,
h:10
});

}

score=0;
document.getElementById("score").innerHTML=0;

}


function update(){


// controls

if(keys["ArrowLeft"]){
player.x-=4;
}

if(keys["ArrowRight"]){
player.x+=4;
}


// wrap

if(player.x>400)
player.x=0;

if(player.x<0)
player.x=400;


// gravity

player.dy+=0.25;
player.y+=player.dy;



// landing

platforms.forEach(p=>{

if(
player.x+player.w>p.x &&
player.x<p.x+p.w &&
player.y+player.h>=p.y &&
player.y+player.h<=p.y+10 &&
player.dy>0
){

player.dy=-9;

score++;

document.getElementById("score").innerHTML=score;

}

});



// camera

if(player.y<250){

let move=250-player.y;

player.y=250;

platforms.forEach(p=>{
p.y+=move;
});

}



// delete old

platforms=platforms.filter(p=>p.y<600);



// add new forever

while(platforms.length<10){

let highest=0;

platforms.forEach(p=>{
if(p.y<highest)
highest=p.y;
});

platforms.push({

x:Math.random()*330,

y:highest-80,

w:70,

h:10

});

}



// game over

if(player.y>600){

alert("Game Over! Score: "+score);

restart();

}

}



function draw(){

ctx.clearRect(0,0,400,600);


// player

ctx.fillStyle="green";

ctx.fillRect(
player.x,
player.y,
player.w,
player.h
);


// platforms

ctx.fillStyle="brown";

platforms.forEach(p=>{

ctx.fillRect(
p.x,
p.y,
p.w,
p.h
);

});

}



function loop(){

update();

draw();

requestAnimationFrame(loop);

}


restart();
loop();

</script>

</body>
</html>
