<!doctype html>
<html>
<head>
<title>Doodle Jump - Malikhi Games</title>

<style>
body{
margin:0;
background:#111827;
color:white;
text-align:center;
font-family:Arial;
}

canvas{
background:#87ceeb;
border:3px solid white;
display:block;
margin:auto;
}

button{
padding:10px 20px;
margin:10px;
border-radius:10px;
border:0;
cursor:pointer;
font-weight:bold;
}
</style>

</head>

<body>

<h1>🦘 Doodle Jump</h1>

<p>⬅️ Left Arrow | Right Arrow ➡️</p>

<h2>Score: <span id="score">0</span></h2>

<canvas id="game" width="400" height="600"></canvas>

<button onclick="restart()">Restart</button>


<script>

const canvas=document.getElementById("game");
const ctx=canvas.getContext("2d");

let player;
let platforms;
let keys={};
let score;


document.addEventListener("keydown",e=>{
keys[e.key]=true;
});


document.addEventListener("keyup",e=>{
keys[e.key]=false;
});


function restart(){

player={
x:180,
y:500,
w:30,
h:30,
dx:0,
dy:0
};


platforms=[];


for(let i=0;i<8;i++){

platforms.push({

x:Math.random()*330,
y:550-i*80,
w:70,
h:10

});

}


score=0;

document.getElementById("score").innerHTML=0;

gameLoop();

}



function update(){


// movement

if(keys["ArrowLeft"]){
player.dx=-3;
}

else if(keys["ArrowRight"]){
player.dx=3;
}

else{
player.dx=0;
}


player.x+=player.dx;


// gravity slower

player.dy+=0.25;

player.y+=player.dy;



// jump

platforms.forEach(p=>{


if(
player.x<p.x+p.w &&
player.x+player.w>p.x &&
player.y+player.h<p.y+10 &&
player.y+player.h>p.y &&
player.dy>0
){

player.dy=-8;

score++;

document.getElementById("score").innerHTML=score;

}

});



// wrap around sides

if(player.x>400){
player.x=0;
}

if(player.x<0){
player.x=400;
}



// camera

if(player.y<250){

let move=250-player.y;

player.y=250;

platforms.forEach(p=>{
p.y+=move;
});

}



// add platforms

while(platforms.length<8){

platforms.push({

x:Math.random()*330,
y:Math.min(...platforms.map(p=>p.y))-80,
w:70,
h:10

});

}



// lose

if(player.y>600){

alert("Game Over! Score: "+score);

restart();

}

}



function draw(){

ctx.clearRect(0,0,400,600);


// player

ctx.fillStyle="green";

ctx.fillRect(
player.x,
player.y,
player.w,
player.h
);


// platforms

ctx.fillStyle="brown";

platforms.forEach(p=>{

ctx.fillRect(
p.x,
p.y,
p.w,
p.h
);

});

}



function gameLoop(){

update();

draw();

requestAnimationFrame(gameLoop);

}


restart();

</script>

</body>
</html>
