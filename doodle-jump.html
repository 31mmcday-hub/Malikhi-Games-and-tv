<!doctype html>
<html>
<head>
<title>Word Rush - Malikhi Games</title>

<style>
body{
margin:0;
background:#111827;
color:white;
font-family:Arial;
text-align:center;
}

canvas{
background:#020617;
border:3px solid white;
display:block;
margin:auto;
}

input{
font-size:22px;
padding:10px;
border-radius:10px;
margin:10px;
}

</style>

</head>

<body>

<h1>💨 Word Rush</h1>

<h2>
Score: <span id="score">0</span>
|
Time: <span id="time">60</span>
</h2>

<canvas id="game" width="500" height="500"></canvas>

<input id="input" placeholder="Type word">

<h2 id="msg"></h2>


<script>

const canvas=document.getElementById("game");
const ctx=canvas.getContext("2d");

const input=document.getElementById("input");

let words=[];
let score=0;
let time=60;
let speed=1;


let wordList=[
"fire",
"jump",
"game",
"power",
"speed",
"dragon",
"robot",
"ninja",
"pizza",
"football",
"computer",
"minecraft",
"castle",
"rocket",
"monster",
"shadow",
"storm",
"laser"
];


function newWord(){

words.push({

text:
wordList[Math.floor(Math.random()*wordList.length)],

x:
Math.random()*350,

y:0

});

}



input.addEventListener("input",()=>{

let typed=input.value.toLowerCase();

words.forEach((w,i)=>{

if(w.text===typed){

words.splice(i,1);

score++;

speed+=0.03;

document.getElementById("score").innerHTML=score;

input.value="";

}

});

});



function update(){


words.forEach(w=>{

w.y+=speed;


if(w.y>500){

words.splice(words.indexOf(w),1);

}

});


if(Math.random()<0.02){

newWord();

}


draw();

}



function draw(){

ctx.clearRect(0,0,500,500);

ctx.font="25px Arial";

ctx.fillStyle="white";


words.forEach(w=>{

ctx.fillText(
w.text,
w.x,
w.y
);

});

}



let game=setInterval(update,20);



let timer=setInterval(()=>{

time--;

document.getElementById("time").innerHTML=time;


if(time<=0){

clearInterval(timer);
clearInterval(game);

document.getElementById("msg").innerHTML=
"🔥 Game Over! Score: "+score;

}

},1000);


</script>

</body>
</html>
