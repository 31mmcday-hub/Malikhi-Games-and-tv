<!doctype html><html><head><meta charset="utf-8"><title>Tetris</title><style>body{margin:0;background:#111;color:white;text-align:center;font:18px Arial}canvas{background:#000;margin-top:20px}</style></head><body><h2>Tetris</h2><canvas id=c width=300 height=600></canvas><script>
const c=document.querySelector('#c'),x=c.getContext('2d'),S=30,C=10,R=20;let board=Array.from({length:R},()=>Array(C).fill(0)),p={x:3,y:0,s:[[1,1,1,1]]};function draw(){x.clearRect(0,0,300,600);for(let y=0;y<R;y++)for(let z=0;z<C;z++)if(board[y][z]){x.fillStyle='#39f';x.fillRect(z*S,y*S,S-1,S-1)}p.s.forEach((row,a)=>row.forEach((v,b)=>{if(v){x.fillStyle='#f5a';x.fillRect((p.x+b)*S,(p.y+a)*S,S-1,S-1)}}))}function hit(dx,dy){return p.s.some((r,a)=>r.some((v,b)=>v&&(p.x+b+dx<0||p.x+b+dx>=C||p.y+a+dy>=R||(board[p.y+a+dy]||[])[p.x+b+dx])))}function drop(){if(!hit(0,1))p.y++;else{p.s.forEach((r,a)=>r.forEach((v,b)=>{if(v&&p.y+a>=0)board[p.y+a][p.x+b]=1}));board=board.filter(r=>r.some(v=>!v));while(board.length<R)board.unshift(Array(C).fill(0));p={x:3,y:0,s:Math.random()>.5?[[1,1,1,1]]:[[1,1],[1,1]]};if(hit(0,0))board=Array.from({length:R},()=>Array(C).fill(0))}}onkeydown=e=>{if(e.key==='ArrowLeft'&&!hit(-1,0))p.x--;if(e.key==='ArrowRight'&&!hit(1,0))p.x++;if(e.key==='ArrowDown')drop();if(e.key==='ArrowUp'){p.s=p.s[0].map((_,i)=>p.s.map(r=>r[i]).reverse())}};setInterval(drop,500);setInterval(draw,30);</script></body></html>
